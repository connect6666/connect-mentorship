<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Call | Connect</title>
<link rel="stylesheet" href="style.css">
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<style>
.call-wrap { max-width:1000px; margin:30px auto; padding:20px; }
.video-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.video-box { background:#111827; height:360px; border-radius:14px; overflow:hidden; color:white; }
.controls { text-align:center; margin-top:20px; }
.controls button { margin:8px; }
@media(max-width:768px){ .video-grid{grid-template-columns:1fr;} }
</style>
</head>

<body>
<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/" style="color:white;text-decoration:none;">Connect</a>
    </div>
  </div>
</nav>

<div class="call-wrap">
  <h2>📞 Secure Mentorship Call</h2>
  <p id="callStatus">Checking session...</p>
  <p id="callTimer" style="font-weight:700;color:#22c55e;">Timer: not started</p>

  <p id="speechWarning" style="font-weight:700;color:#ef4444;"></p>

  <div class="video-grid">
    <div class="video-box" id="local-player"></div>
    <div class="video-box" id="remote-player"></div>
  </div>

  <div class="controls">
    <button class="btn" id="joinBtn">Join Call</button>
    <button class="btn btn-outline" id="muteBtn">Mute Mic</button>
    <button class="btn btn-outline" id="cameraBtn">Turn Camera Off</button>
    <button class="btn" id="leaveBtn" style="background:#ef4444;color:white;">Leave Call</button>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const sessionId = params.get("sessionId");

const callStatus = document.getElementById("callStatus");
const callTimer = document.getElementById("callTimer");

  const speechWarning = document.getElementById("speechWarning");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const muteBtn = document.getElementById("muteBtn");
const cameraBtn = document.getElementById("cameraBtn");

joinBtn.disabled = true;
muteBtn.disabled = true;
cameraBtn.disabled = true;

const AGORA_APP_ID = "22c5f354475d4e61a4956b72745fc298";

let client = null;
let localTracks = { audioTrack: null, videoTrack: null };
let currentUser = null;
let sessionData = null;
let joined = false;
let micMuted = false;
let cameraOff = false;
let callTimerInterval = null;
let callEndTime = null;

async function getToken(channelName) {
  const res = await fetch(`https://connect-agora-server.onrender.com/token?channel=${channelName}`);
  const data = await res.json();
  return data.token;
}

function blockCall(message) {
  callStatus.innerText = message;
  joinBtn.disabled = true;
  muteBtn.disabled = true;
  cameraBtn.disabled = true;
  leaveBtn.disabled = true;
}

async function verifyCallAccess(user) {
  if (!sessionId) return blockCall("Invalid call link ❌");

  const snap = await getDoc(doc(db, "sessions", sessionId));
  if (!snap.exists()) return blockCall("Session not found ❌");

  sessionData = snap.data();

  const isMember = user.uid === sessionData.studentId || user.uid === sessionData.mentorId;
  if (!isMember) return blockCall("Access denied ❌");

  if (sessionData.paymentStatus !== "paid") return blockCall("Payment required before call 🔒");
  if (sessionData.sessionType !== "call") return blockCall("This is chat-only session. Call not allowed 🔒");

  callStatus.innerText = "Call access verified ✅ Click Join Call.";
  joinBtn.disabled = false;
}

function startCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);

  callTimerInterval = setInterval(async () => {
    if (!callEndTime) return;

    const remaining = Math.floor((callEndTime - Date.now()) / 1000);

    if (remaining <= 0) {
      clearInterval(callTimerInterval);
      callTimer.innerText = "Call time ended";
      await leaveCall(true);
      return;
    }

    const min = Math.floor(remaining / 60);
    const sec = remaining % 60;
    callTimer.innerText = `Time left: ${min}m ${sec}s`;
  }, 1000);
}

async function setupCallEndTime() {
  const freshSnap = await getDoc(doc(db, "sessions", sessionId));
  const freshSession = freshSnap.data();
  sessionData = freshSession;

  if (freshSession.callEndsAt) {
    callEndTime = freshSession.callEndsAt.toDate
      ? freshSession.callEndsAt.toDate().getTime()
      : new Date(freshSession.callEndsAt).getTime();

    await updateDoc(doc(db, "sessions", sessionId), {
      callStatus: "live",
      updatedAt: serverTimestamp()
    });

    return;
  }

  const durationMinutes = freshSession.durationMinutes || 30;
  const endTime = new Date(Date.now() + durationMinutes * 60 * 1000);

  await updateDoc(doc(db, "sessions", sessionId), {
    callStatus: "live",
    callStartedAt: serverTimestamp(),
    callEndsAt: endTime,
    updatedAt: serverTimestamp()
  });

  callEndTime = endTime.getTime();
}


// speech detaction

  let recognition = null;

function checkSensitiveSpeech(text) {
const patterns = [
  /\b\d{10}\b/,                 // direct number
  /\b\d{5}\s?\d{5}\b/,         // spaced number
  /\b\d{3}\s\d{3}\s\d{4}\b/,   // spoken format

  /@gmail\.com|@yahoo\.com|@outlook\.com/i,

  /whatsapp number/i,
  /send me on whatsapp/i,
  /text me/i,
  /call me/i,
  /contact me/i,

  /upi id/i,
  /paytm number/i
];

  if (patterns.some(p => p.test(text))) {
  speechWarning.innerText = "⚠️ Sharing personal contact is not allowed. Stay on platform.";

setTimeout(() => {
  speechWarning.innerText = "";
}, 5000);

console.warn("Sensitive speech detected:", text);
  }
}

function startSpeechDetection() {
    if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
    recognition = null;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    console.log("Speech detection not supported in this browser.");
    speechWarning.innerText = "Speech privacy check not supported on this browser.";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-IN";
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    let transcript = "";

   for (let i = event.resultIndex; i < event.results.length; i++) {
  if (event.results[i].isFinal) {
    transcript += event.results[i][0].transcript + " ";
  }
}

if (transcript) {
  checkSensitiveSpeech(transcript.toLowerCase());
}
  };

  recognition.onerror = (event) => {
    console.log("Speech recognition error:", event.error);
  };

  recognition.onend = () => {
    if (joined) {
      try {
        recognition.start();
      } catch (e) {}
    }
  };

  recognition.start();
}
  

async function joinCall() {
  if (joined) return;
  if (!currentUser) {
    callStatus.innerText = "Please wait, checking login...";
    return;
  }

  try {
    joinBtn.disabled = true;
    const channelName = sessionId;

    client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

    client.on("user-published", async (user, mediaType) => {
      await client.subscribe(user, mediaType);
      if (mediaType === "video") user.videoTrack.play("remote-player");
      if (mediaType === "audio") user.audioTrack.play();
    });

    client.on("user-joined", (user) => {
      console.log("User joined:", user.uid);
    });

    client.on("user-unpublished", () => {
      document.getElementById("remote-player").innerHTML = "";
    });

    const agoraUid =
      Number(String(currentUser.uid).slice(-6).replace(/\D/g, "")) ||
      Math.floor(Math.random() * 100000);

    const token = await getToken(channelName);

    await client.join(AGORA_APP_ID, channelName, token, agoraUid);

    const tracks = await AgoraRTC.createMicrophoneAndCameraTracks(
      { AEC: true, ANS: true, AGC: true },
      { encoderConfig: "480p_1" }
    );

    localTracks.audioTrack = tracks[0];
    localTracks.videoTrack = tracks[1];

    localTracks.videoTrack.play("local-player");

    await client.publish([localTracks.audioTrack, localTracks.videoTrack]);

    await setupCallEndTime();

    joined = true;
    callStatus.innerText = "Call live ✅";
    joinBtn.style.display = "none";
    muteBtn.disabled = false;
    cameraBtn.disabled = false;
    startCallTimer();
    startSpeechDetection();

  } catch (error) {
    console.error("JOIN ERROR:", error);
    callStatus.innerText = "Call failed ❌ Check console";
    joinBtn.disabled = false;
  }
}

async function leaveCall(autoEnded = false) {
  try {
    if (localTracks.audioTrack) {
      localTracks.audioTrack.close();
      localTracks.audioTrack = null;
    }

    if (localTracks.videoTrack) {
      localTracks.videoTrack.close();
      localTracks.videoTrack = null;
    }

    if (client) {
      await client.leave();
      client = null;
    }

    await updateDoc(doc(db, "sessions", sessionId), {
      callStatus: autoEnded ? "ended_auto" : "ended",
      callEndedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    joined = false;
    callStatus.innerText = autoEnded ? "Call time ended ✅" : "Call ended ✅";

    if (callTimerInterval) clearInterval(callTimerInterval);

    if (recognition) {
  recognition.stop();
  recognition = null;
}
speechWarning.innerText = "";
    callTimer.innerText = autoEnded ? "Call time ended" : "Call ended";

    joinBtn.style.display = "inline-block";
    joinBtn.disabled = autoEnded;
    muteBtn.disabled = true;
    cameraBtn.disabled = true;

    document.getElementById("local-player").innerHTML = "";
    document.getElementById("remote-player").innerHTML = "";

  } catch (error) {
    console.error("LEAVE ERROR:", error);
  }
}

joinBtn.onclick = joinCall;
leaveBtn.onclick = () => leaveCall(false);

muteBtn.onclick = async () => {
  if (!localTracks.audioTrack) return;
  micMuted = !micMuted;
  await localTracks.audioTrack.setEnabled(!micMuted);
  muteBtn.innerText = micMuted ? "Unmute Mic" : "Mute Mic";
};

cameraBtn.onclick = async () => {
  if (!localTracks.videoTrack) return;
  cameraOff = !cameraOff;
  await localTracks.videoTrack.setEnabled(!cameraOff);
  cameraBtn.innerText = cameraOff ? "Turn Camera On" : "Turn Camera Off";
};

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

  currentUser = user;
  await verifyCallAccess(user);
});
</script>
</body>
</html>
