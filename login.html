<!DOCTYPE html>
<html>
<head>
  <title>Login | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button id="loginBtn" class="btn">Login</button>

  <button id="googleLogin" class="btn" style="margin-top:10px;">
    🔵 Continue with Google
  </button>

  <p>New user? <a href="signup.html">Signup</a></p>
  <p id="msg"></p>
</div>

<script type="module">
import { auth, db } from "./auth.js";

import {
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const msg = document.getElementById("msg");

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    msg.style.color = "red";
    msg.innerText = "Enter email and password ❌";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "index.html";
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Wrong email or password ❌";
  }
});

document.getElementById("googleLogin").addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      await setDoc(userRef, {
        name: user.displayName || "User",
        email: user.email,
        phone: "",
        role: "",
        verified: false,
        experience: 0,
        createdAt: new Date()
      });

      window.location.href = "select-role.html";
      return;
    }

    const data = snap.data();

    if (!data.role) {
      window.location.href = "select-role.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (error) {
    console.error(error);
    msg.style.color = "red";
    msg.innerText = "Google login failed ❌";
  }
});
</script>

</body>
</html>
