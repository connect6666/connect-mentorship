<!DOCTYPE html>
<html>
<head>
  <title>Login | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="login()" class="btn">Login</button>

  <!-- ✅ GOOGLE LOGIN BUTTON -->
  <button id="googleLogin" class="btn" style="margin-top:10px;">
    🔵 Continue with Google
  </button>

  <p>New user? <a href="signup.html">Signup</a></p>

  <p id="msg"></p>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  getDoc, 
  setDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("msg");


// 🔐 EMAIL LOGIN
window.login = async function() {

  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    msg.style.color = "green";
    msg.innerText = "Login successful ✅";

    window.location.href = "index.html";

  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Wrong email or password ❌";
  }
};


// 🔵 GOOGLE LOGIN
const googleBtn = document.getElementById("googleLogin");

if (googleBtn) {

  googleBtn.addEventListener("click", async () => {

    const provider = new GoogleAuthProvider();

    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      // 🔥 SAVE USER IF NOT EXISTS
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
  await setDoc(userRef, {
    name: user.displayName || "User",
    role: "", // empty role
    createdAt: new Date()
  });
}
const data = (await getDoc(userRef)).data();

if (!data.role) {
  window.location.href = "select-role.html";
} else {
  window.location.href = "index.html";
}

      window.location.href = "index.html";

    } catch (error) {
      console.error(error);
      msg.style.color = "red";
      msg.innerText = "Google login failed ❌";
    }

  });

}

</script>

</body>
</html>
