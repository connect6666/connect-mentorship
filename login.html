  <title>Login | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button id="loginBtn" class="btn">Login</button>

  <button id="forgotBtn" class="btn btn-outline" style="margin-top:10px;">
  Forgot Password
</button>

  <button id="googleLogin" class="btn" style="margin-top:10px;">
    🔵 Continue with Google
  </button>

  <p>New user? <a href="signup.html">Signup</a></p>
  <p id="msg"></p>
</div>

<script type="module">
import { auth, db } from "./auth.js";

import {
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const msg = document.getElementById("msg");


  const blockedDomains = [
  "tempmail.com",
  "10minutemail.com",
  "mailinator.com",
  "guerrillamail.com",
  "yopmail.com"
];

function isFakeEmail(email) {
  const domain = email.split("@")[1]?.toLowerCase();
  return blockedDomains.includes(domain);
}

async function redirectByRole(user) {
  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    window.location.href = "select-role.html";
    return;
  }

  const data = snap.data();

  if (data.banned === true) {
    await signOut(auth);
    msg.style.color = "red";
    msg.innerText = "Your account is banned ❌";
    return;
  }

  if (!data.role) {
    window.location.href = "select-role.html";
    return;
  }

  if (data.isAdmin === true) {
    window.location.href = "admin.html";
    return;
  }

  if (data.role === "mentor") {
    window.location.href = "mentor-profile.html?id=" + user.uid;
    return;
  }

  window.location.href = "index.html";
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    msg.style.color = "red";
    msg.innerText = "Enter email and password ❌";
    return;
  }

  try {
  if (isFakeEmail(email)) {
  msg.style.color = "red";
  msg.innerText = "Temporary/fake email not allowed ❌";
  return;
}

const result = await signInWithEmailAndPassword(auth, email, pass);
const user = result.user;

if (!user.emailVerified) {
  await signOut(auth);
  msg.style.color = "red";
  msg.innerText = "Please verify your email before login ❌";
  return;
}

await redirectByRole(user);
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Wrong email or password ❌";
  }
 
});
document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    msg.style.color = "red";
    msg.innerText = "Enter your email first ❌";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    msg.style.color = "green";
    msg.innerText = "Password reset email sent ✅";
  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Could not send reset email ❌";
  }
});

  
document.getElementById("googleLogin").addEventListener("click", async () => {
  const provider = new GoogleAuthProvider();

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      await setDoc(userRef, {
        name: user.displayName || "User",
        email: user.email,
        phone: "",
        role: "",
        verified: false,
        experience: 0,
        createdAt: new Date()
      });

     

      window.location.href = "select-role.html";
      return;
    }

    const data = snap.data();

    if (!data.role) {
      window.location.href = "select-role.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (error) {
    console.error(error);
    msg.style.color = "red";
    msg.innerText = "Google login failed ❌";
  }
});
</script>

</body>
</html>
