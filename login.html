<!DOCTYPE html>
<html>
<head>
  <title>Login | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="login()" class="btn">Login</button>

  <p>New user? <a href="signup.html">Signup</a></p>

  <p id="msg"></p>
</div>

<!-- 🔥 FIREBASE LOGIN (CLEAN + CORRECT VERSION) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f",
  measurementId: "G-RJM7CM2LCB"
};

// Init
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN FUNCTION
window.login = async function() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) {
    document.getElementById("msg").innerText = "Fill all fields ⚠️";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    document.getElementById("msg").innerText = "Login successful ✅";

    // redirect after login
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);

  } catch (error) {
    document.getElementById("msg").innerText = "Wrong email or password ❌";
  }
};
</script>

  <script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
