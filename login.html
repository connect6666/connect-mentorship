<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 LOGIN
========================= */

.login-wrapper {
  max-width: 400px;
  margin: 100px auto;
  padding: 0 20px;
}

.login-card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
}

.login-card input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}

.google-btn {
  background: #fff;
  border: 1px solid #e2e8f0;
  color: #333;
}

</style>

</head>

<body>

<div class="login-wrapper">

  <div class="login-card">

    <h2>Welcome Back 👋</h2>
    <p style="color:#64748b;">Login to continue</p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()" class="btn" id="loginBtn">
      Login
    </button>

    <button id="googleLogin" class="btn google-btn">
      🔵 Continue with Google
    </button>

    <p style="margin-top:15px;">
      New user? <a href="signup.html">Signup</a>
    </p>

    <p id="msg"></p>

  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  getDoc, 
  setDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("msg");

/* =========================
   🔐 EMAIL LOGIN
========================= */

window.login = async function() {

  const email = email.value;
  const pass = password.value;

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    msg.style.color = "green";
    msg.innerText = "Login successful ✅";

    window.location.href = "index.html";

  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Wrong email or password ❌";
  }

  btn.innerText = "Login";
};


/* =========================
   🔵 GOOGLE LOGIN
========================= */

document.getElementById("googleLogin").addEventListener("click", async () => {

  const provider = new GoogleAuthProvider();

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      await setDoc(userRef, {
        name: user.displayName || "User",
        role: "",
        createdAt: new Date()
      });
    }

    const data = (await getDoc(userRef)).data();

    // ✅ FIXED REDIRECT LOGIC
    if (!data.role) {
      window.location.href = "select-role.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (error) {
    msg.style.color = "red";
    msg.innerText = "Google login failed ❌";
  }

});

</script>

</body>
</html>
