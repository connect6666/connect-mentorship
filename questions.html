<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Questions | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
.questions-container {
  max-width: 800px;
  margin: 40px auto;
}

.question-card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.answer {
  margin-top: 12px;
  padding: 12px;
  background: #eef2ff;
  border-left: 4px solid #4f46e5;
  border-radius: 8px;
}

.reply {
  font-size: 14px;
  margin-top: 6px;
  padding-left: 10px;
}

button {
  cursor: pointer;
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
  </div>
</nav>

<div class="questions-container" id="questionsList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  doc,
  getDoc,
  updateDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

let currentUser = null;
let isMentor = false;

// 🔐 USER CHECK
onAuthStateChanged(auth, async (user) => {

  if (user) {
    currentUser = user;

    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().role === "mentor") {
      isMentor = true;
    }
  }

  loadRealtime();
});

// 🔐 SAFE HTML
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

// 🚀 REALTIME LOAD
function loadRealtime() {

  onSnapshot(collection(db, "questions"), (questionsSnap) => {

    container.innerHTML = "";

    questionsSnap.forEach(qDoc => {

      const q = qDoc.data();
      const qId = qDoc.id;

      const card = document.createElement("div");
      card.className = "question-card";
      card.innerHTML = `
        <h3>${escapeHTML(q.question)}</h3>
        <small>${escapeHTML(q.name || "User")} | ${escapeHTML(q.category)}</small>
        <div id="answers-${qId}"></div>
      `;

      container.appendChild(card);

      // 🔥 ANSWERS REALTIME
      const answersQuery = query(
        collection(db, "answers"),
        where("questionId", "==", qId)
      );

      onSnapshot(answersQuery, (answersSnap) => {

        const answersContainer = document.getElementById("answers-" + qId);
        answersContainer.innerHTML = "";

        let answers = [];
        answersSnap.forEach(a => answers.push({ id: a.id, ...a.data() }));

        // SORT BY VOTES
        answers.sort((a, b) => (b.votes || 0) - (a.votes || 0));

        answers.forEach(ans => {

          const ansDiv = document.createElement("div");
          ansDiv.className = "answer";

          ansDiv.innerHTML = `
            ${escapeHTML(ans.text)}
            <br>
            <small>Answered by ${escapeHTML(ans.mentorName || "Mentor")}</small>
            <br>
            👍 ${ans.votes || 0}
            <button onclick="upvote('${ans.id}')">Upvote</button>

            <div>
              <button onclick="toggleReplies('${ans.id}')">
                💬 <span id="count-${ans.id}">0</span> Replies
              </button>
            </div>

            <div id="replies-${ans.id}" style="display:none;"></div>

            <input id="reply-${ans.id}" placeholder="Write reply..." style="width:70%;">
            <button onclick="submitReply('${ans.id}')">Reply</button>
          `;

          answersContainer.appendChild(ansDiv);

          // 🔥 REPLIES REALTIME
          const repliesQuery = query(
            collection(db, "replies"),
            where("answerId", "==", ans.id)
          );

          onSnapshot(repliesQuery, (snap) => {

            const box = document.getElementById("replies-" + ans.id);
            let count = 0;
            box.innerHTML = "";

            snap.forEach(r => {
              count++;
              const data = r.data();

              box.innerHTML += `
                <div class="reply">
                  💬 <b>${escapeHTML(data.userName)}</b>: ${escapeHTML(data.text)}
                </div>
              `;
            });

            document.getElementById("count-" + ans.id).innerText = count;
          });
        });

        // 🔥 ANSWER BOX (MENTOR ONLY)
        if (isMentor) {
          answersContainer.innerHTML += `
            <textarea id="ans-${qId}"></textarea>
            <button onclick="submitAnswer('${qId}')">Answer</button>
          `;
        }

      });

    });

  });
}

// 🔥 TOGGLE
window.toggleReplies = function(id) {
  const el = document.getElementById("replies-" + id);
  el.style.display = el.style.display === "none" ? "block" : "none";
};

// 🔥 ANSWER
window.submitAnswer = async function(qId) {

  if (!isMentor) return alert("Only mentors");

  const text = document.getElementById("ans-" + qId).value;

  const snap = await getDoc(doc(db, "users", currentUser.uid));
  const name = snap.exists() ? snap.data().name : "Mentor";

  await addDoc(collection(db, "answers"), {
    questionId: qId,
    text,
    mentorName: name,
    userId: currentUser.uid,
    votes: 0,
    upvotedBy: [],
    createdAt: new Date()
  });
};

// 🔥 UPVOTE
window.upvote = async function(id) {

  if (!currentUser) return alert("Login required");

  const ref = doc(db, "answers", id);
  const snap = await getDoc(ref);
  const data = snap.data();

  if ((data.upvotedBy || []).includes(currentUser.uid)) {
    return alert("Already voted");
  }

  await updateDoc(ref, {
    votes: (data.votes || 0) + 1,
    upvotedBy: [...(data.upvotedBy || []), currentUser.uid]
  });
};

// 🔥 REPLY (WITH FIX + UX)
window.submitReply = async function(answerId) {

  const input = document.getElementById("reply-" + answerId);
  const text = input.value.trim();

  if (!text) return alert("Write reply");

  let name = "User";

  if (currentUser) {
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    if (snap.exists()) {
      name = snap.data().name || "User";
    }
  }

  await addDoc(collection(db, "replies"), {
    answerId,
    text,
    userName: name,
    createdAt: new Date()
  });

  // ✅ CLEAR + FEEDBACK
  input.value = "";
  input.placeholder = "Reply sent ✅";

  setTimeout(() => {
    input.placeholder = "Write reply...";
  }, 1500);
};

</script>

</body>
</html>
