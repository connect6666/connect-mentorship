<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Questions | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
.questions-container {
  max-width: 800px;
  margin: 40px auto;
}

.question-card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask Question</a>
      <a href="questions.html">Questions</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="questions-container" id="questionsList"></div>

<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

/* SAFE HTML */
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* LOAD QUESTIONS ONLY (OPTIMIZED) */
function loadQuestions() {

  const qRef = query(
    collection(db, "questions"),
    orderBy("createdAt", "desc"),
    limit(20)
  );

  onSnapshot(qRef, (questionsSnap) => {

    container.innerHTML = "";

    /* ✅ EMPTY STATE */
    if (questionsSnap.empty) {
      container.innerHTML = "No questions yet. Be the first to ask 🚀";
      return;
    }

    questionsSnap.forEach(qDoc => {

      const q = qDoc.data();
      const qId = qDoc.id;

      const card = document.createElement("div");
      card.className = "question-card";

      card.innerHTML = `
        <h3>
          <a href="view-question.html?id=${qId}" 
             style="text-decoration:none;color:black;">
            ${escapeHTML(q.question)}
          </a>
        </h3>

        <small>
          ${escapeHTML(q.name || "User")} | 
          ${escapeHTML(q.category || "General")}
        </small>
      `;

      container.appendChild(card);
    });

  });
}

/* INIT */
onAuthStateChanged(auth, () => {
  loadQuestions();
});

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

<script type="module" src="auth.js"></script>

</body>
</html>
