<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Questions | Connect</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .questions-container { max-width: 800px; margin: 40px auto; }
    .question-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
    .answer { margin-top: 12px; padding: 12px; background: #eef2ff; border-left: 4px solid #4f46e5; }
    .reply { font-size: 14px; margin-top: 6px; }
    button { cursor: pointer; margin-top: 5px; }
  </style>
</head>

<body>

<div class="questions-container" id="questionsList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  doc,
  getDoc,
  updateDoc,
  onSnapshot,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  appId: "1:229549559214:web:..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

let currentUser = null;
let isMentor = false;
let replyCooldown = {};


// ✅ AUTH FIX (IMPORTANT)
onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if (user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().role === "mentor") {
      isMentor = true;
    }
  }

  loadRealtime();
});


// 🔐 SAFE HTML
function escapeHTML(str) {
  return str?.replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[m])) || "";
}


// 🚀 REALTIME SYSTEM
function loadRealtime() {

  onSnapshot(collection(db, "questions"), (qSnap) => {

    container.innerHTML = "";

    qSnap.forEach(qDoc => {

      const q = qDoc.data();
      const qId = qDoc.id;

      const answersQuery = query(collection(db, "answers"), where("questionId", "==", qId));

      onSnapshot(answersQuery, (aSnap) => {

        let answers = [];
        aSnap.forEach(d => answers.push({ id: d.id, ...d.data() }));

        // ✅ SORT BY VOTES
        answers.sort((a, b) => (b.votes || 0) - (a.votes || 0));

        let html = "";

        answers.forEach(ans => {

          // 🔥 REPLIES REALTIME
          onSnapshot(query(collection(db,"replies"), where("answerId","==",ans.id)), (rSnap) => {

            const replies = [];
            rSnap.forEach(r => replies.push(r.data()));

            const el = document.getElementById("replies-" + ans.id);
            if (el) {
              el.innerHTML = replies.map(r => `
                <div class="reply">💬 <b>${escapeHTML(r.userName)}</b>: ${escapeHTML(r.text)}</div>
              `).join("");
            }

            const count = document.getElementById("count-" + ans.id);
            if (count) count.innerText = replies.length;
          });

          html += `
          <div class="answer">

            ${escapeHTML(ans.text)}
            <br><small>Answered by ${escapeHTML(ans.mentorName || "Mentor")}</small>

            <br>👍 ${ans.votes || 0}
            <button onclick="upvote('${ans.id}')">Upvote</button>

            <div>
              <button onclick="toggleReplies('${ans.id}')">
                💬 <span id="count-${ans.id}">0</span> Replies
              </button>
            </div>

            <div id="replies-${ans.id}" style="display:none;"></div>

            <input id="reply-${ans.id}" placeholder="Write reply...">
            <button onclick="submitReply('${ans.id}')">Reply</button>

          </div>`;
        });

        let answerBox = "";
        if (isMentor) {
          answerBox = `
            <textarea id="ans-${qId}" placeholder="Write answer..."></textarea>
            <button onclick="submitAnswer('${qId}')">Answer</button>
          `;
        }

        container.innerHTML += `
        <div class="question-card">
          <h3>${escapeHTML(q.question)}</h3>
          <div>${escapeHTML(q.name || "User")} | ${escapeHTML(q.category)}</div>
          ${html}
          ${answerBox}
        </div>`;
      });
    });
  });
}


// 🔥 TOGGLE REPLIES
window.toggleReplies = id => {
  const el = document.getElementById("replies-" + id);
  el.style.display = el.style.display === "none" ? "block" : "none";
};


// 🔥 SUBMIT ANSWER (MENTOR ONLY)
window.submitAnswer = async function(qId) {

  if (!currentUser) return alert("Login required ❌");

  const text = document.getElementById("ans-" + qId).value.trim();

  if (!text) return alert("Write answer ❌");
  if (text.length > 500) return alert("Max 500 characters ❌");

  const snap = await getDoc(doc(db,"users",currentUser.uid));
  const name = snap.exists() ? snap.data().name : "Mentor";

  await addDoc(collection(db,"answers"), {
    questionId: qId,
    text,
    mentorName: name,
    userId: currentUser.uid,
    votes: 0,
    upvotedBy: [],
    createdAt: new Date()
  });

  document.getElementById("ans-" + qId).value = "";
};


// 🔥 FIXED UPVOTE (MAIN BUG FIX)
window.upvote = async function(id) {

  const user = auth.currentUser; // ✅ ALWAYS CORRECT

  if (!user) {
    alert("Login required ❌");
    return;
  }

  const ref = doc(db, "answers", id);
  const snap = await getDoc(ref);
  const data = snap.data();

  // ✅ PREVENT MULTIPLE VOTES
  if ((data.upvotedBy || []).includes(user.uid)) {
    return alert("Already voted ❌");
  }

  await updateDoc(ref, {
    votes: increment(1), // ✅ FIXED
    upvotedBy: [...(data.upvotedBy || []), user.uid]
  });
};


// 🔥 REPLY SYSTEM
window.submitReply = async function(answerId) {

  const input = document.getElementById("reply-" + answerId);
  const btn = input.nextElementSibling;
  const text = input.value.trim();

  if (!text) return alert("Write reply ❌");
  if (text.length > 300) return alert("Max 300 chars ❌");

  const now = Date.now();
  if (replyCooldown[answerId] && now - replyCooldown[answerId] < 5000) {
    return alert("Wait 5 sec ❌");
  }

  replyCooldown[answerId] = now;

  btn.disabled = true;
  btn.innerText = "Sending...";

  let name = "User";

  if (currentUser) {
    const snap = await getDoc(doc(db,"users",currentUser.uid));
    if (snap.exists()) name = snap.data().name;
  }

  await addDoc(collection(db,"replies"), {
    answerId,
    text,
    userName: name,
    createdAt: new Date()
  });

  // ✅ CLEAR INPUT (FIXED BUG)
  input.value = "";
  input.placeholder = "Reply sent ✅";

  setTimeout(() => {
    input.placeholder = "Write reply...";
    btn.disabled = false;
    btn.innerText = "Reply";
  }, 1500);
};

</script>

</body>
</html>
