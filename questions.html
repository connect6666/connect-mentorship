<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Questions | Connect</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .questions-container { max-width: 800px; margin: 40px auto; }
    .question-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    .question-meta { font-size: 14px; color: gray; margin-top: 10px; }
    .answer { margin-top: 12px; padding: 12px; background: #eef2ff; border-left: 4px solid #4f46e5; border-radius: 8px; }
    .reply { font-size: 14px; margin-top: 6px; padding-left: 10px; }
    .vote-btn { margin-top: 6px; cursor: pointer; background: none; border: none; color: #4f46e5; font-weight: bold; }
  </style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="mentor.html">Become Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">login</a>

    </div>
  </div>
</nav>

<section>
  <div class="container">
    <h2>All Questions</h2>
  </div>
</section>

<div class="questions-container" id="questionsList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, where, doc,
  getDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  appId: "1:229549559214:web:..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

let currentUser = null;
let isMentor = false;

// ✅ PER ANSWER COOLDOWN
let replyCooldown = {};

// 🔐 AUTH
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().role === "mentor") {
      isMentor = true;
    }
  }
  loadRealtime();
});

// 🔐 SAFE HTML
function escapeHTML(str) {
  return str?.replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[m])) || "";
}

// 🚀 REALTIME LOAD
function loadRealtime() {

  onSnapshot(collection(db, "questions"), (qSnap) => {

    container.innerHTML = "";

    qSnap.forEach(qDoc => {

      const q = qDoc.data();
      const qId = qDoc.id;

      const answersQuery = query(collection(db, "answers"), where("questionId", "==", qId));

      onSnapshot(answersQuery, (aSnap) => {

        let answers = [];
        aSnap.forEach(d => answers.push({ id: d.id, ...d.data() }));

        answers.sort((a,b) => (b.votes||0)-(a.votes||0));

        let html = "";

        answers.forEach(ans => {

          // replies listener
          onSnapshot(query(collection(db,"replies"),where("answerId","==",ans.id)), (rSnap)=>{
            const replies = [];
            rSnap.forEach(r=>replies.push(r.data()));

            const el = document.getElementById("replies-"+ans.id);
            if(el){
              el.innerHTML = replies.map(r=>`
                <div class="reply">💬 <strong>${escapeHTML(r.userName)}</strong>: ${escapeHTML(r.text)}</div>
              `).join("");
            }

            const count = document.getElementById("count-"+ans.id);
            if(count) count.innerText = replies.length;
          });

          html += `
          <div class="answer">
            ${escapeHTML(ans.text)}
            <small>Answered by ${escapeHTML(ans.mentorName||"Mentor")}</small>

            👍 ${ans.votes||0}
            <button onclick="upvote('${ans.id}')">Upvote</button>

            <div>
              <button onclick="toggleReplies('${ans.id}')">
                💬 <span id="count-${ans.id}">0</span> Replies
              </button>
            </div>

            <div id="replies-${ans.id}" style="display:none;"></div>

            <input id="reply-${ans.id}" placeholder="Write reply...">
            <button onclick="submitReply('${ans.id}')">Reply</button>
          </div>
          `;
        });

        let answerBox = "";
        if(isMentor){
          answerBox = `
          <textarea id="ans-${qId}"></textarea>
          <button onclick="submitAnswer('${qId}')">Answer</button>`;
        }

        container.innerHTML += `
        <div class="question-card">
          <h3>${escapeHTML(q.question)}</h3>
          <div class="question-meta">${escapeHTML(q.name||"User")} | ${escapeHTML(q.category)}</div>
          ${html}
          ${answerBox}
        </div>`;
      });
    });
  });
}

// 🔥 TOGGLE
window.toggleReplies = id => {
  const el = document.getElementById("replies-"+id);
  el.style.display = el.style.display==="none"?"block":"none";
};

// 🔥 ANSWER
window.submitAnswer = async function(qId){

  const text = document.getElementById("ans-"+qId).value.trim();

  if(!text) return alert("Write answer ❌");
  if(text.length>500) return alert("Max 500 characters ❌");

  const snap = await getDoc(doc(db,"users",currentUser.uid));
  const name = snap.exists()?snap.data().name:"Mentor";

  await addDoc(collection(db,"answers"),{
    questionId:qId,
    text,
    mentorName:name,
    userId:currentUser.uid,
    votes:0,
    upvotedBy:[],
    createdAt:new Date()
  });
};

// 🔥 UPVOTE
window.upvote = async function(id){

  if(!currentUser) return alert("Login required");

  const ref = doc(db,"answers",id);
  const snap = await getDoc(ref);
  const data = snap.data();

  if((data.upvotedBy||[]).includes(currentUser.uid)){
    return alert("Already voted ❌");
  }

  await updateDoc(ref,{
    votes:(data.votes||0)+1,
    upvotedBy:[...(data.upvotedBy||[]),currentUser.uid]
  });
};

// 🔥 REPLY
window.submitReply = async function(answerId){

  const input = document.getElementById("reply-"+answerId);
  const btn = input.nextElementSibling;

  const text = input.value.trim();

  if(!text) return alert("Write reply");
  if(text.length>300) return alert("Max 300 chars");

  const now = Date.now();
  if(replyCooldown[answerId] && now - replyCooldown[answerId] < 5000){
    return alert("Wait 5 sec ❌");
  }
  replyCooldown[answerId] = now;

  btn.disabled = true;
  btn.innerText = "Sending...";

  let name="User";
  if(currentUser){
    const snap = await getDoc(doc(db,"users",currentUser.uid));
    if(snap.exists()) name=snap.data().name;
  }

  await addDoc(collection(db,"replies"),{
    answerId,text,userName:name,createdAt:new Date()
  });

  input.value="";

  setTimeout(()=>{
    btn.disabled=false;
    btn.innerText="Reply";
  },3000);
};

</script>

</body>
</html>
