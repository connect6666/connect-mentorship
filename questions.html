<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Questions | Connect</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .questions-container {
      max-width: 800px;
      margin: 40px auto;
    }

    .question-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .question-meta {
      font-size: 14px;
      color: gray;
      margin-top: 10px;
    }

    .answer {
      margin-top: 12px;
      padding: 12px;
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      border-radius: 8px;
      font-size: 15px;
    }

    .answer small {
      display: block;
      margin-top: 6px;
      color: gray;
    }

    .vote-btn {
      margin-top: 6px;
      cursor: pointer;
      background: none;
      border: none;
      color: #4f46e5;
      font-weight: bold;
    }

    .answer-box {
      margin-top: 15px;
    }

    .answer-box textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .answer-box button {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      background: #4f46e5;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="mentor.html">Become Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</nav>

<section>
  <div class="container">
    <h2>All Questions</h2>
  </div>
</section>

<div class="questions-container" id="questionsList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  query,
  where,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

let currentUser = null;
let isMentor = false;

// 🔐 CHECK USER ROLE
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;

    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().role === "mentor") {
      isMentor = true;
    }
  }

  loadQuestions();
});

// 🔐 SAFE HTML
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

// 🔥 LOAD QUESTIONS
async function loadQuestions() {
  const questionsSnap = await getDocs(collection(db, "questions"));
  container.innerHTML = "";

  for (const docSnap of questionsSnap.docs) {
    const q = docSnap.data();
    const qId = docSnap.id;

    const answersSnap = await getDocs(query(
      collection(db, "answers"),
      where("questionId", "==", qId)
    ));

    let answers = [];
    answersSnap.forEach(d => {
      answers.push({ id: d.id, ...d.data() });
    });

    // 🔥 SORT BY VOTES
    answers.sort((a, b) => (b.votes || 0) - (a.votes || 0));

    let answersHTML = "";

    answers.forEach(ans => {
      answersHTML += `
        <div class="answer">
          ${escapeHTML(ans.text)}

          <small>Answered by ${escapeHTML(ans.mentorName || "Mentor")}</small>

          👍 <span>${ans.votes || 0}</span>
          <button class="vote-btn" onclick="upvote('${ans.id}')">Upvote</button>
        </div>
      `;
    });

    let answerBox = "";
    if (isMentor) {
      answerBox = `
        <div class="answer-box">
          <textarea id="ans-${qId}" placeholder="Write answer..."></textarea>
          <button onclick="submitAnswer('${qId}')">Submit Answer</button>
        </div>
      `;
    }

    container.innerHTML += `
      <div class="question-card">
        <h3>${escapeHTML(q.question)}</h3>

        <div class="question-meta">
          ${escapeHTML(q.name || "User")} | ${escapeHTML(q.category)}
        </div>

        ${answersHTML || "<p>No answers yet</p>"}

        ${answerBox}
      </div>
    `;
  }
}

// 🔥 SUBMIT ANSWER
window.submitAnswer = async function(qId) {

  if (!isMentor) return alert("Only mentors ❌");

  const text = document.getElementById("ans-" + qId).value.trim();
  if (!text) return alert("Write answer");

  let name = "Mentor";

  const snap = await getDoc(doc(db, "users", currentUser.uid));
  if (snap.exists()) {
    name = snap.data().name || "Mentor";
  }

  await addDoc(collection(db, "answers"), {
    questionId: qId,
    text,
    mentorName: name,
    userId: currentUser.uid,
    votes: 0,
    upvotedBy: [],
    createdAt: new Date()
  });

  loadQuestions();
};

// 🔥 UPVOTE (ONE TIME ONLY)
window.upvote = async function(answerId) {

  if (!currentUser) {
    alert("Login required");
    return;
  }

  const ref = doc(db, "answers", answerId);
  const snap = await getDoc(ref);

  const data = snap.data();
  const userId = currentUser.uid;

  if ((data.upvotedBy || []).includes(userId)) {
    alert("Already voted ❌");
    return;
  }

  await updateDoc(ref, {
    votes: (data.votes || 0) + 1,
    upvotedBy: [...(data.upvotedBy || []), userId]
  });

  loadQuestions();
};

</script>

</body>
</html>
