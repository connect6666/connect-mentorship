<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Questions | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 PAGE
========================= */

.questions-wrapper {
  max-width: 850px;
  margin: 40px auto;
  padding: 0 20px;
}

/* HEADER */
.questions-header {
  text-align: center;
  margin-bottom: 25px;
}

.questions-header p {
  color: #64748b;
}

/* CARD */
.question-card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 14px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* META */
.question-meta {
  font-size: 13px;
  color: #64748b;
  margin-top: 6px;
}

/* ANSWERS */
.answer {
  margin-top: 15px;
  padding: 15px;
  background: #eef2ff;
  border-left: 4px solid #4f46e5;
  border-radius: 10px;
}

.answer small {
  display: block;
  margin-top: 6px;
  color: #64748b;
}

/* REPLIES */
.reply {
  margin-top: 8px;
  font-size: 14px;
  padding-left: 10px;
}

/* INPUT */
textarea, input {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

button {
  margin-top: 8px;
}

</style>

</head>

<body>

<nav>
  <div class="container nav-flex">
    <div class="logo"><a href="index.html">Connect</a></div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
    </div>
  </div>
</nav>

<div class="questions-wrapper">

  <div class="questions-header">
    <h2>Explore Questions</h2>
    <p>Learn from real answers shared by students</p>
  </div>

  <div id="questionsList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  doc,
  getDoc,
  updateDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");

let currentUser = null;
let isMentor = false;

/* AUTH */
onAuthStateChanged(auth, async (user) => {

  if (user) {
    currentUser = user;

    const snap = await getDoc(doc(db, "users", user.uid));

    if (snap.exists()) {
      const data = snap.data();
      if (data.role === "mentor" && data.verified === true) {
        isMentor = true;
      }
    }
  }

  loadRealtime();
});

/* SAFE */
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* REALTIME */
function loadRealtime() {

  onSnapshot(collection(db, "questions"), (questionsSnap) => {

    container.innerHTML = "";

    questionsSnap.forEach(qDoc => {

      const q = qDoc.data();
      const qId = qDoc.id;

      const card = document.createElement("div");
      card.className = "question-card";

      card.innerHTML = `
        <h3>${escapeHTML(q.question)}</h3>
        <div class="question-meta">
          ${escapeHTML(q.name || "User")} • ${escapeHTML(q.category)}
        </div>

        <div id="answers-${qId}"></div>
      `;

      container.appendChild(card);

      /* ANSWERS */
      const answersQuery = query(
        collection(db, "answers"),
        where("questionId", "==", qId)
      );

      onSnapshot(answersQuery, (answersSnap) => {

        const box = document.getElementById("answers-" + qId);
        box.innerHTML = "";

        let answers = [];
        answersSnap.forEach(a => answers.push({ id: a.id, ...a.data() }));

        answers.sort((a,b)=> (b.votes||0)-(a.votes||0));

        answers.forEach(ans => {

          box.innerHTML += `
            <div class="answer">
              ${escapeHTML(ans.text)}

              <small>
                ${escapeHTML(ans.mentorName || "Mentor")}
                ${ans.verified ? "✅" : ""}
              </small>

              👍 ${ans.votes || 0}
              <button onclick="upvote('${ans.id}')">Upvote</button>

              <div>
                <button onclick="toggleReplies('${ans.id}')">
                  💬 <span id="count-${ans.id}">0</span> Replies
                </button>
              </div>

              <div id="replies-${ans.id}" style="display:none;"></div>

              <input id="reply-${ans.id}" placeholder="Write reply...">
              <button onclick="submitReply('${ans.id}')">Reply</button>
            </div>
          `;

          /* REPLIES */
          const repliesQuery = query(
            collection(db, "replies"),
            where("answerId","==",ans.id)
          );

          onSnapshot(repliesQuery, snap => {

            const rBox = document.getElementById("replies-"+ans.id);
            let count = 0;
            rBox.innerHTML = "";

            snap.forEach(r=>{
              count++;
              const data = r.data();

              rBox.innerHTML += `
                <div class="reply">
                  💬 <b>${escapeHTML(data.userName)}</b>: ${escapeHTML(data.text)}
                </div>
              `;
            });

            document.getElementById("count-"+ans.id).innerText = count;
          });

        });

        /* ANSWER BOX */
        if (isMentor) {
          box.innerHTML += `
            <textarea id="ans-${qId}" placeholder="Write answer..."></textarea>
            <button onclick="submitAnswer('${qId}')">Submit Answer</button>
          `;
        }

      });

    });

  });
}

/* ACTIONS */
window.toggleReplies = function(id) {
  const el = document.getElementById("replies-" + id);
  el.style.display = el.style.display === "none" ? "block" : "none";
};

window.submitAnswer = async function(qId) {

  if (!isMentor) return alert("Only verified mentors");

  const text = document.getElementById("ans-"+qId).value;

  const snap = await getDoc(doc(db,"users",currentUser.uid));
  const data = snap.data();

  await addDoc(collection(db,"answers"),{
    questionId:qId,
    text,
    mentorName:data.name||"Mentor",
    userId:currentUser.uid,
    verified:true,
    votes:0,
    upvotedBy:[],
    createdAt:new Date()
  });
};

window.upvote = async function(id) {

  if (!currentUser) return alert("Login required");

  const ref = doc(db,"answers",id);
  const snap = await getDoc(ref);
  const data = snap.data();

  if ((data.upvotedBy||[]).includes(currentUser.uid)) {
    return alert("Already voted");
  }

  await updateDoc(ref,{
    votes:(data.votes||0)+1,
    upvotedBy:[...(data.upvotedBy||[]),currentUser.uid]
  });
};

window.submitReply = async function(answerId) {

  const input = document.getElementById("reply-"+answerId);
  const text = input.value.trim();

  if (!text) return alert("Write reply");

  let name = "User";

  if (currentUser) {
    const snap = await getDoc(doc(db,"users",currentUser.uid));
    if (snap.exists()) name = snap.data().name || "User";
  }

  await addDoc(collection(db,"replies"),{
    answerId,
    text,
    userName:name,
    createdAt:new Date()
  });

  input.value = "";
};

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
