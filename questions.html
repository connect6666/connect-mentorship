<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Browse student questions and answers about career, exams, college, and skills. Learn from real experiences and mentorship.">
<meta name="robots" content="index, follow">
<title>Student Questions & Answers | Career Guidance India</title>
<link rel="canonical" href="https://connect6666.github.io/connect-mentorship/questions.html">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
/* PRO UI STYLING */
.question-search-box input {
  width: 100%;
  max-width: 500px;
  padding: 14px;
  border-radius: 30px;
  border: 1px solid #ddd;
  margin: 20px auto;
  display: block;
}

.question-filters {
  text-align: center;
  margin-bottom: 25px;
}

.filter-btn {
  padding: 10px 18px;
  margin: 5px;
  border-radius: 20px;
  border: none;
  background: #f1f5f9;
  cursor: pointer;
  font-weight: 600;
}

.filter-btn.active,
.filter-btn:hover {
  background: #2563eb;
  color: white;
}

.questions-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.question-card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  transition: 0.3s;
  animation: fadeIn 0.3s ease;
}

.question-card:hover {
  transform: translateY(-5px);
}

.no-result {
  text-align: center;
  color: red;
  display: none;
}

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.95);}
  to {opacity: 1; transform: scale(1);}
}
</style>

</head>

<body>

<!-- NAV SAME -->
<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/">Connect</a>
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/view-question.html">View Answer</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Become Mentor</a>
      <a href="/connect-mentorship/about.html">About</a>
      <a href="/connect-mentorship/contact.html">Contact</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<section class="container">
  <h1>Student Questions and Career Guidance</h1>
  <p>Browse real questions asked by students.</p>
</section>

<!-- 🔥 NEW PRO FILTER + SEARCH -->
<section class="container">
  <input type="text" id="searchInput" placeholder="Search questions..." class="question-search-box">

  <div class="question-filters">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="career">Career</button>
    <button class="filter-btn" data-category="skills">Skills</button>
    <button class="filter-btn" data-category="college">College</button>
  </div>
</section>

<!-- QUESTIONS -->
<div class="questions-container" id="questionsList"></div>

<p id="noResult" class="no-result">No questions found</p>

  <footer>
    <div style="margin-top:10px; font-size:14px; color:gray;">
  <a href="privacy.html">Privacy</a> |
  <a href="terms.html">Terms</a> |
  <a href="cookie.html">Cookies</a> |
  <a href="disclaimer.html">Disclaimer</a>
</div>
    <p>© 2026 Connect Mentorship</p>
  </footer>

<!-- FIREBASE LOGIC -->
<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const container = document.getElementById("questionsList");
const searchInput = document.getElementById("searchInput");
const noResult = document.getElementById("noResult");

let allQuestions = [];
let selectedCategory = "all";

/* LOAD QUESTIONS */
function loadQuestions() {

  const qRef = query(collection(db, "questions"), orderBy("createdAt", "desc"), limit(50));

  onSnapshot(qRef, (snap) => {
    allQuestions = [];

    snap.forEach(doc => {
      const data = doc.data();
      allQuestions.push({
        id: doc.id,
        question: data.question,
        name: data.name || "User",
        category: (data.category || "general").toLowerCase()
      });
    });

    renderQuestions();
  });
}

/* RENDER */
function renderQuestions() {

  container.innerHTML = "";
  let visible = 0;

  const searchText = searchInput.value.toLowerCase();

  allQuestions.forEach(q => {

    const matchCategory = selectedCategory === "all" || q.category === selectedCategory;
    const matchSearch = q.question.toLowerCase().includes(searchText);

    if (matchCategory && matchSearch) {

      visible++;

      const card = document.createElement("div");
      card.className = "question-card";

     card.innerHTML = `
  <h3>
    <a href="/connect-mentorship/view-question.html?id=${q.id}" class="question-title-link">
      ${q.question}
    </a>
  </h3>
  <small class="question-meta">${q.name} | ${q.category}</small>
`;

      container.appendChild(card);
    }
  });

  noResult.style.display = visible === 0 ? "block" : "none";
}

/* FILTER BUTTON */
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    selectedCategory = btn.dataset.category;
    renderQuestions();
  });
});

/* SEARCH */
searchInput.addEventListener("input", renderQuestions);

/* INIT */
onAuthStateChanged(auth, () => loadQuestions());

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

<script type="module" src="auth.js"></script>

</body>
</html>
