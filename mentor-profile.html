<body>

<section class="container">
  <h1>Mentor Profile</h1>
  <p>View details of experienced mentors and connect with them for career guidance.</p>
</section>

<section class="container">
  <p>You can also <a href="/connect-mentorship/ask.html">ask your questions</a> or
  <a href="/connect-mentorship/questions.html">browse student questions</a>.</p>
</section>

<div class="profile-container">
  <div class="profile-card" id="profile">Loading...</div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  addDoc,
  collection,
  serverTimestamp,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const id = new URLSearchParams(window.location.search).get("id");
const profile = document.getElementById("profile");

let currentUser = null;
let mentorData = null;

function escapeHTML(str) {
  return String(str || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function showError(title, text) {
  profile.innerHTML = `
    <div class="empty-state">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(text)}</p>
      <a href="/connect-mentorship/mentor.html" class="btn">Browse Mentors</a>
    </div>
  `;
}

function renderProfile(data) {
  const isOwner = currentUser && currentUser.uid === id;
  const safeName = escapeHTML(data.name || "Mentor");
  const safeBio = escapeHTML(data.bio || "This mentor provides guidance related to career choices, college decisions, and skill development.");
  const safeSkills = escapeHTML(data.skills || "Career Guidance • College Advice • Skill Development");

  const photoURL = data.photoURL ||
    `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || "Mentor")}&background=6366f1&color=fff&size=200`;

  profile.innerHTML = `
    <div class="mentor-header">
      <div class="avatar-wrapper">
        <img src="${photoURL}" class="profile-img" alt="${safeName}">

        ${isOwner ? `
          <input type="file" id="uploadDP" accept="image/*" hidden>
          <button class="change-dp-btn" onclick="document.getElementById('uploadDP').click()">
            Change Photo
          </button>
        ` : ""}
      </div>

      <div class="mentor-info">
        <h2>${safeName}</h2>
        <span class="verified-badge">✔ Verified Mentor</span>
        <p class="mentor-skill">${safeSkills}</p>
      </div>
    </div>

    ${isOwner ? `<button class="btn" onclick="showEditProfileForm()">Edit Profile</button>` : ""}

    <p><strong>Experience:</strong> ${data.experience ? escapeHTML(data.experience) + " years" : "Not added"}</p>
    <p>${safeBio}</p>

   ${!isOwner ? `
<button class="chat-btn btn" onclick="bookSession('${id}', 'chat')">
  💬 Book Chat Session ₹99
</button>

<button class="chat-btn btn btn-outline" onclick="bookSession('${id}', 'call')">
  📞 Book Call Session ₹199
</button>

` : ""}

    <p style="font-size:10px; color:gray; margin-top:15px;">
      Verification confirms identity only. Connect does not guarantee results or outcomes.
    </p>
  `;

  attachUploadListener();
}

function renderEditForm(data) {
  profile.innerHTML = `
    <h2>Edit Mentor Profile</h2>

    <input type="text" id="editName" placeholder="Your name" value="${escapeHTML(data.name || "")}">
    <input type="number" id="editExperience" placeholder="Experience in years" value="${escapeHTML(data.experience || "")}">
    <input type="text" id="editSkills" placeholder="Skills e.g. Career, Coding, Exams" value="${escapeHTML(data.skills || "")}">
    <textarea id="editBio" placeholder="Write short mentor bio...">${escapeHTML(data.bio || "")}</textarea>

    <button class="btn" onclick="saveProfileChanges()">Save Changes</button>
    <button class="btn btn-outline" onclick="renderProfile(mentorData)">Cancel</button>

    <p id="editMsg"></p>
  `;
}

window.showEditProfileForm = function() {
  if (!currentUser || currentUser.uid !== id) {
    alert("You can edit only your own profile ❌");
    return;
  }
  renderEditForm(mentorData || {});
};

window.saveProfileChanges = async function() {
  if (!currentUser || currentUser.uid !== id) {
    alert("Unauthorized ❌");
    return;
  }

  const name = document.getElementById("editName").value.trim();
  const experience = document.getElementById("editExperience").value.trim();
  const skills = document.getElementById("editSkills").value.trim();
  const bio = document.getElementById("editBio").value.trim();
  const editMsg = document.getElementById("editMsg");

  if (!name) {
    editMsg.innerText = "Name required ❌";
    editMsg.style.color = "red";
    return;
  }

  await updateDoc(doc(db, "users", id), {
    name,
    experience,
    skills,
    bio
  });

  mentorData = {
    ...mentorData,
    name,
    experience,
    skills,
    bio
  };

  editMsg.innerText = "Profile updated ✅";
  editMsg.style.color = "green";

  setTimeout(() => renderProfile(mentorData), 800);
};

function attachUploadListener() {
  const input = document.getElementById("uploadDP");
  if (!input) return;

  input.addEventListener("change", async (e) => {
    if (!currentUser || currentUser.uid !== id) {
      alert("You can change only your own photo ❌");
      return;
    }

    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Only image allowed ❌");
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      alert("Max 2MB allowed ❌");
      return;
    }

    try {
      const storageRef = ref(storage, `profileImages/${id}/profile.jpg`);
      await uploadBytes(storageRef, file);

      const url = await getDownloadURL(storageRef);

      await updateDoc(doc(db, "users", id), {
        photoURL: url
      });

      mentorData.photoURL = url;
      alert("Profile photo updated ✅");
      renderProfile(mentorData);

    } catch (err) {
      console.error(err);
      alert("Upload failed ❌ Check Storage Rules");
    }
  });
}

async function loadMentorProfile() {
  if (!id) {
    showError("Invalid mentor link ❌", "No mentor ID found in URL.");
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      showError("Mentor not found ❌", "This mentor profile does not exist.");
      return;
    }

    const data = snap.data();

    if (data.role !== "mentor" || data.verified !== true) {
      showError("Mentor not available ❌", "This mentor is not verified yet.");
      return;
    }

    mentorData = data;
    renderProfile(data);

  } catch (error) {
    console.error(error);
    showError("Error loading profile ❌", "Please try again later.");
  }
}


// book session

// book session with date + slot + double booking protection

const AVAILABLE_SLOTS = [
  "09:00 AM - 09:30 AM",
  "10:00 AM - 10:30 AM",
  "11:00 AM - 11:30 AM",
  "02:00 PM - 02:30 PM",
  "03:00 PM - 03:30 PM",
  "04:00 PM - 04:30 PM",
  "05:00 PM - 05:30 PM"
];

function cleanSlotId(text) {
  return text.replaceAll(" ", "_").replaceAll(":", "-");
}

window.bookSession = async function(mentorId, type) {
  const user = auth.currentUser;

  if (!user) {
    alert("Please login to book a session ❌");
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

  if (user.uid === mentorId) {
    alert("You cannot book yourself ❌");
    return;
  }

  const selectedDate = prompt("Enter session date in YYYY-MM-DD format\nExample: 2026-05-10");

  if (!selectedDate) return;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const chosenDate = new Date(selectedDate);
  chosenDate.setHours(0, 0, 0, 0);

  if (chosenDate < today) {
    alert("Past date not allowed ❌");
    return;
  }

  const slotText = AVAILABLE_SLOTS
    .map((slot, index) => `${index + 1}. ${slot}`)
    .join("\n");

  const slotChoice = prompt(`Choose time slot number:\n\n${slotText}`);

  if (!slotChoice) return;

  const selectedSlot = AVAILABLE_SLOTS[Number(slotChoice) - 1];

  if (!selectedSlot) {
    alert("Invalid slot selected ❌");
    return;
  }

  try {
    const chatId = [user.uid, mentorId].sort().join("_");
    const isCall = type === "call";
    const amount = isCall ? 199 : 99;
    const duration = isCall ? 30 : 15;

    const slotId = `${mentorId}_${selectedDate}_${cleanSlotId(selectedSlot)}`;
    const slotRef = doc(db, "bookedSlots", slotId);
    const sessionRef = doc(collection(db, "sessions"));

    // 🔒 Double booking protection
    await runTransaction(db, async (transaction) => {
      const slotSnap = await transaction.get(slotRef);

      if (slotSnap.exists()) {
        const slotData = slotSnap.data();

        if (["locked", "paid", "active", "pending_admin"].includes(slotData.status)) {
          throw new Error("This slot is already booked. Please choose another slot.");
        }
      }

      transaction.set(slotRef, {
        mentorId,
        studentId: user.uid,
        sessionId: sessionRef.id,
        date: selectedDate,
        timeSlot: selectedSlot,
        sessionType: type,
        status: "locked",
        lockedAt: serverTimestamp()
      });

      transaction.set(sessionRef, {
        studentId: user.uid,
        mentorId,
        chatId,

        sessionType: type,
        date: selectedDate,
        timeSlot: selectedSlot,

        status: "pending_payment",
        paymentStatus: "unpaid",
        chatStatus: "locked",
        callStatus: isCall ? "locked" : null,

        amount,
        durationMinutes: duration,
        slotId,

        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    });

    const orderRes = await fetch("https://us-central1-connect-mentorship.cloudfunctions.net/createOrder", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        amount,
        sessionType: type
      })
    });

    const orderData = await orderRes.json();

    if (!orderRes.ok || !orderData.success) {
      await updateDoc(slotRef, { status: "failed_order", updatedAt: serverTimestamp() });
      await updateDoc(sessionRef, { status: "payment_failed", updatedAt: serverTimestamp() });
      alert("Payment order failed ❌");
      console.error(orderData);
      return;
    }

    const options = {
      key: "rzp_live_SkWu8CaCqPCe9m",
      amount: orderData.order.amount,
      currency: "INR",
      name: "Connect Mentorship",
      description: isCall ? "Paid Call Session ₹199" : "Paid Chat Session ₹99",
      order_id: orderData.order.id,

      handler: async function(response) {
        const verifyRes = await fetch("https://us-central1-connect-mentorship.cloudfunctions.net/verifyPayment", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            ...response,
            sessionId: sessionRef.id
          })
        });

        const verifyData = await verifyRes.json();

        if (!verifyRes.ok || !verifyData.success) {
          await updateDoc(slotRef, { status: "payment_verify_failed", updatedAt: serverTimestamp() });
          await updateDoc(sessionRef, { status: "payment_verify_failed", updatedAt: serverTimestamp() });
          alert("Payment verification failed ❌");
          console.error(verifyData);
          return;
        }

        await updateDoc(sessionRef, {
          status: "pending_admin",
          paymentStatus: "paid",
          chatStatus: "locked",
          callStatus: isCall ? "locked" : null,

          razorpayOrderId: response.razorpay_order_id,
          razorpayPaymentId: response.razorpay_payment_id,

          paidAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        await updateDoc(slotRef, {
          status: "pending_admin",
          paymentStatus: "paid",
          paidAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        await setDoc(doc(db, "chats", chatId), {
          studentId: user.uid,
          mentorId,
          participants: [user.uid, mentorId],
          status: "locked",
          sessionId: sessionRef.id,
          sessionType: type,
          paymentStatus: "paid",
          chatStatus: "locked",
          sessionMinutes: duration,
          updatedAt: serverTimestamp()
        }, { merge: true });

        alert("Payment successful ✅ Your session is booked. Admin will inform you before meeting.");

        window.location.href =
          `/connect-mentorship/chat.html?chatId=${chatId}&mentorId=${mentorId}&sessionId=${sessionRef.id}`;
      },

      modal: {
        ondismiss: async function() {
          await updateDoc(slotRef, {
            status: "cancelled",
            updatedAt: serverTimestamp()
          });

          await updateDoc(sessionRef, {
            status: "cancelled",
            paymentStatus: "unpaid",
            updatedAt: serverTimestamp()
          });

          alert("Payment cancelled. Slot released.");
        }
      },

      prefill: {
        email: user.email || ""
      },

      theme: {
        color: "#4f46e5"
      }
    };

    const razorpay = new Razorpay(options);
    razorpay.open();

  } catch (error) {
    console.error(error);
    alert(error.message || "Booking failed ❌");
  }
};
 
  

window.startChat = async function(mentorId) {
  const user = auth.currentUser;

  if (!user) {
    alert("Please login to chat with mentor ❌");
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

  if (user.uid === mentorId) {
    alert("You cannot chat with yourself ❌");
    return;
  }

  try {
    const chatId = [user.uid, mentorId].sort().join("_");

    await setDoc(doc(db, "chats", chatId), {
      studentId: user.uid,
      mentorId: mentorId,
      participants: [user.uid, mentorId],
      status: "active",
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    }, { merge: true });

    window.location.href = `/connect-mentorship/chat.html?chatId=${chatId}&mentorId=${mentorId}`;

  } catch (error) {
    console.error(error);
    alert("Chat failed ❌ Check Firestore rules.");
  }
};

onAuthStateChanged(auth, (user) => {
  currentUser = user || null;
  loadMentorProfile();
});
</script>
