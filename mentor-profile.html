</head>

<body>

<nav>

</div>

  <section class="container">
  <h1>Mentor Profile</h1>

  <p>
    View details of experienced mentors and connect with them for career guidance, exam preparation, and skill development.
  </p>
</section>

 <section class="container">
  <p>
    You can also <a href="/connect-mentorship/ask.html">ask your questions</a> or 
    <a href="/connect-mentorship/questions.html">browse student questions</a>.
  </p>
</section>

<div class="profile-container">
  <div class="profile-card" id="profile">
    Loading...
  </div>
</div>

<script type="module">

import { initializeApp, getApps, getApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

/* ✅ Prevent duplicate Firebase init */
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   GET ID FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const profile = document.getElementById("profile");

/* ❌ INVALID ID */
if (!id || id.length < 10) {
  profile.innerHTML = `
  <div class="empty-state">
    <h2>Invalid mentor link ❌</h2>
    <p>This profile does not exist or the link is incorrect.</p>
    <a href="/connect-mentorship/mentor.html" class="btn">
      Browse Mentors
    </a>
  </div>
`;
} else {

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      profile.innerHTML = "Mentor not found ❌";
    } else {

      const data = snap.data();

      /* 🔒 ONLY VERIFIED MENTORS */
      if (data.role !== "mentor" || data.verified !== true) {
        profile.innerHTML = "Mentor not available ❌";
      } else {

        /* 🔒 XSS PROTECTION */
        const safeName = (data.name || "User")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        profile.innerHTML = `
  <div class="mentor-header">

    <img src="${data.photoURL || `https://ui-avatars.com/api/?name=${safeName}&background=6366f1&color=fff&size=200`}" class="profile-img">

    <div class="mentor-info">
      <h2>${safeName}</h2>
      <span class="verified-badge">✔ Verified Mentor</span>
    </div>

  </div>

  <p style="margin-top:15px;">
    Experience: ${
      data.experience
        ? data.experience >= 5
          ? data.experience + "+ years"
          : data.experience + " years"
        : "Not added"
    }
  </p>

  <p>
    This mentor provides guidance related to career choices, college decisions, and skill development based on real experience.
  </p>

  <button class="chat-btn" onclick="startChat('${id}')">
    💬 Chat with Mentor
  </button>

  <p style="font-size:10px; color:gray; margin-top:15px;">
    Verification confirms identity only. Connect does not guarantee results or outcomes.
  </p>
`;
      }
    }

  } catch (error) {
    console.error("Error:", error);
    profile.innerHTML = "Error loading profile ❌";
  }
}

/* =========================
   CHAT BUTTON
========================= */
window.startChat = function(id) {
  alert("Chat feature coming soon 🚀");
};

</script>

<script type="module" src="auth.js"></script>

 <script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Person",
 "name": "${safeName}",
 "jobTitle": "Student Mentor",
 "description": "Verified mentor providing career guidance",
 "url": window.location.href
}
</script>

</body>
</html>
