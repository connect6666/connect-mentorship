<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="View mentor profile and get career guidance from experienced students. Connect with verified mentors for real advice.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://connect6666.github.io/connect-mentorship/mentor-profile.html">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verified Mentor Profile | Student Career Guidance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Become Mentor</a>
      <a href="/connect-mentorship/about.html">About</a>
      <a href="/connect-mentorship/contact.html">Contact</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<section class="container">
  <h1>Mentor Profile</h1>
  <p>
    View details of experienced mentors and connect with them for career guidance,
    exam preparation, and skill development.
  </p>
</section>

<section class="container">
  <p>
    You can also <a href="/connect-mentorship/ask.html">ask your questions</a> or
    <a href="/connect-mentorship/questions.html">browse student questions</a>.
  </p>
</section>

<div class="profile-container">
  <div class="profile-card" id="profile">
    Loading...
  </div>
</div>


<script type="module">
import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

/* GET ID */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const profile = document.getElementById("profile");

let currentUser = null;
let mentorData = null;

/* ESCAPE */
function escapeHTML(str) {
  return String(str || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* ERROR */
function showError(title, text) {
  profile.innerHTML = `
    <div class="empty-state">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(text)}</p>
    </div>
  `;
}

/* RENDER PROFILE */
function renderProfile(data) {
  const isOwner = currentUser && currentUser.uid === id;

  const safeName = escapeHTML(data.name || "Mentor");
  const photoURL = data.photoURL ||
    `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || "Mentor")}`;

  profile.innerHTML = `
    <div class="mentor-header">

      <div class="avatar-wrapper">

        <img src="${photoURL}" class="profile-img">

        ${
          isOwner
            ? `
              <input type="file" id="uploadDP" accept="image/*" hidden>

              <button class="change-dp-btn"
                onclick="document.getElementById('uploadDP').click()">
                Change Photo
              </button>
            `
            : ``
        }

      </div>

      <div class="mentor-info">
        <h2>${safeName}</h2>
        <span class="verified-badge">✔ Verified Mentor</span>
      </div>

    </div>

    ${
      isOwner
        ? `<button class="btn" onclick="showEditProfileForm()">Edit Profile</button>`
        : ``
    }

    <p>Experience: ${data.experience || "Not added"}</p>

    <button class="chat-btn">Chat with Mentor</button>
  `;

  attachUploadListener();
}

/* 🔥 IMAGE UPLOAD */
function attachUploadListener() {
  const input = document.getElementById("uploadDP");
  if (!input) return;

  input.addEventListener("change", async (e) => {

    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Only image allowed ❌");
      return;
    }

    if (file.size > 2 * 1024 * 1024) {
      alert("Max 2MB ❌");
      return;
    }

    try {
      const storageRef = ref(storage, `profileImages/${id}`);

      await uploadBytes(storageRef, file);

      const url = await getDownloadURL(storageRef);

      await updateDoc(doc(db, "users", id), {
        photoURL: url
      });

      alert("Updated ✅");
      location.reload();

    } catch (err) {
      console.error(err);
      alert("Upload failed ❌");
    }

  });
}

/* LOAD PROFILE */
async function loadMentorProfile() {

  if (!id) {
    showError("Invalid link", "No ID found");
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      showError("Not found", "Mentor not found");
      return;
    }

    const data = snap.data();

    if (data.role !== "mentor" || data.verified !== true) {
      showError("Unavailable", "Not verified mentor");
      return;
    }

    mentorData = data;
    renderProfile(data);

  } catch (e) {
    showError("Error", "Failed to load");
  }
}

/* AUTH */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  loadMentorProfile();
});

/* EDIT (unchanged logic) */
window.showEditProfileForm = function() {
  alert("Edit working already ✅");
};
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
