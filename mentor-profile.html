<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="View mentor profile and get career guidance from experienced students. Connect with verified mentors for real advice.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://connect6666.github.io/connect-mentorship/mentor-profile.html">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verified Mentor Profile | Student Career Guidance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Become Mentor</a>
      <a href="/connect-mentorship/about.html">About</a>
      <a href="/connect-mentorship/contact.html">Contact</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<section class="container">
  <h1>Mentor Profile</h1>
  <p>
    View details of experienced mentors and connect with them for career guidance,
    exam preparation, and skill development.
  </p>
</section>

<section class="container">
  <p>
    You can also <a href="/connect-mentorship/ask.html">ask your questions</a> or
    <a href="/connect-mentorship/questions.html">browse student questions</a>.
  </p>
</section>

<div class="profile-container">
  <div class="profile-card" id="profile">
    Loading...
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const profile = document.getElementById("profile");

let currentUser = null;
let mentorData = null;

function escapeHTML(str) {
  return String(str || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function showError(title, text) {
  profile.innerHTML = `
    <div class="empty-state">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(text)}</p>
      <a href="/connect-mentorship/mentor.html" class="btn">Browse Mentors</a>
    </div>
  `;
}

function getCleanSkills(skills) {
  if (Array.isArray(skills) && skills.length) {
    return skills
      .map(skill => String(skill).trim())
      .filter(Boolean)
      .slice(0, 8);
  }

  return ["Career Guidance", "College Advice", "Skill Development"];
}

function addPersonSchema(name, bio) {
  document.querySelectorAll('script[data-dynamic-schema="mentor"]').forEach(el => el.remove());

  const schema = {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": name,
    "jobTitle": "Student Mentor",
    "description": bio,
    "url": window.location.href
  };

  const schemaScript = document.createElement("script");
  schemaScript.type = "application/ld+json";
  schemaScript.dataset.dynamicSchema = "mentor";
  schemaScript.textContent = JSON.stringify(schema);
  document.head.appendChild(schemaScript);
}

function renderProfile(data) {
  const isOwner = currentUser && currentUser.uid === id;

  const safeName = escapeHTML(data.name || "Mentor");
  const experience = Number(data.experience || 0);
  const rating = Number(data.rating || 4.5);
  const bioRaw = data.bio || "This mentor helps students with career decisions, college guidance, exams, and skill development.";
  const bio = escapeHTML(bioRaw);
  const skillsRaw = getCleanSkills(data.skills);
  const skills = skillsRaw.map(skill => escapeHTML(skill));

  const photoURL = data.photoURL ||
    `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || "Mentor")}&background=6366f1&color=fff&size=200`;

  profile.innerHTML = `
    <div class="mentor-header">
      <div class="avatar-wrapper">
        <img src="${photoURL}" class="profile-img" alt="${safeName}">
      </div>

      <div class="mentor-info">
        <h2>${safeName}</h2>
        <span class="verified-badge">✔ Verified Mentor</span>
        <p class="mentor-skill">⭐ ${rating.toFixed(1)} Rating • ${experience} yrs experience</p>
      </div>
    </div>

    ${
      isOwner
        ? `
          <div style="margin-top:18px;">
            <button class="btn" onclick="showEditProfileForm()">Edit Profile</button>
          </div>
        `
        : ``
    }

    <div style="margin-top:22px;">
      <h3>About Mentor</h3>
      <p>${bio}</p>
    </div>

    <div style="margin-top:22px;">
      <h3>Skills & Guidance Areas</h3>
      <div style="margin-top:12px;">
        ${skills.map(skill => `
          <span style="
            display:inline-block;
            margin:5px;
            padding:7px 13px;
            border-radius:999px;
            background:rgba(99,102,241,0.2);
            border:1px solid rgba(165,180,252,0.22);
            color:#c7d2fe;
            font-size:13px;
            font-weight:700;
          ">${skill}</span>
        `).join("")}
      </div>
    </div>

    <div style="margin-top:22px;">
      <h3>Experience</h3>
      <p>${experience ? experience + (experience >= 5 ? "+ years" : " years") : "Not added"}</p>
    </div>

    <button class="chat-btn btn" onclick="startChat('${id}')" style="margin-top:20px;">
      💬 Chat with Mentor
    </button>

    <p style="font-size:10px; color:gray; margin-top:15px;">
      Verification confirms identity only. Connect does not guarantee results or outcomes.
    </p>
  `;

  addPersonSchema(data.name || "Mentor", bioRaw);
}

window.showEditProfileForm = function() {
  if (!currentUser || currentUser.uid !== id) {
    alert("You are not allowed to edit this profile ❌");
    return;
  }

  const data = mentorData || {};

  const currentBio = escapeHTML(data.bio || "");
  const currentExperience = Number(data.experience || 0);
  const currentRating = Number(data.rating || 4.5);
  const currentSkills = getCleanSkills(data.skills).join(", ");

  profile.innerHTML = `
    <h2>Edit Mentor Profile</h2>
    <p style="max-width:620px;margin:0 auto 20px;">
      Update your mentor bio, skills, experience, and rating. These details help students trust your profile.
    </p>

    <form id="editProfileForm" class="question-form" style="margin-top:20px;">

      <label style="display:block;text-align:left;margin-bottom:6px;">Bio</label>
      <textarea id="editBio" maxlength="500" placeholder="Write a short mentor bio..." required>${currentBio}</textarea>

      <label style="display:block;text-align:left;margin-bottom:6px;">Skills / Guidance Areas</label>
      <input 
        type="text" 
        id="editSkills" 
        value="${escapeHTML(currentSkills)}" 
        placeholder="Career Guidance, Exams, College Advice"
        required
      >

      <label style="display:block;text-align:left;margin-bottom:6px;">Experience</label>
      <input 
        type="number" 
        id="editExperience" 
        value="${currentExperience}" 
        min="0" 
        max="50" 
        required
      >

      <label style="display:block;text-align:left;margin-bottom:6px;">Rating</label>
      <input 
        type="number" 
        id="editRating" 
        value="${currentRating}" 
        min="1" 
        max="5" 
        step="0.1"
        required
      >

      <button type="submit" class="btn">Save Changes</button>
      <button type="button" class="btn btn-outline" onclick="renderProfile(mentorData)" style="margin-top:10px;">
        Cancel
      </button>

      <p id="editMessage"></p>
    </form>
  `;

  document.getElementById("editProfileForm").addEventListener("submit", saveProfileChanges);
};

async function saveProfileChanges(e) {
  e.preventDefault();

  if (!currentUser || currentUser.uid !== id) {
    alert("You are not allowed to edit this profile ❌");
    return;
  }

  const msg = document.getElementById("editMessage");
  const btn = e.target.querySelector("button[type='submit']");

  const bio = document.getElementById("editBio").value.trim().replace(/<[^>]*>?/gm, "");
  const skillsText = document.getElementById("editSkills").value.trim();
  const experience = Number(document.getElementById("editExperience").value);
  const rating = Number(document.getElementById("editRating").value);

  const skills = skillsText
    .split(",")
    .map(skill => skill.trim())
    .filter(Boolean)
    .slice(0, 8);

  function showEditError(text) {
    msg.innerText = "❌ " + text;
    msg.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Save Changes";
  }

  btn.disabled = true;
  btn.innerText = "Saving...";

  if (bio.length < 20) {
    showEditError("Bio must be at least 20 characters");
    return;
  }

  if (skills.length < 1) {
    showEditError("Add at least one skill");
    return;
  }

  if (experience < 0 || experience > 50) {
    showEditError("Experience must be between 0 and 50 years");
    return;
  }

  if (rating < 1 || rating > 5) {
    showEditError("Rating must be between 1 and 5");
    return;
  }

  try {
    await updateDoc(doc(db, "users", id), {
      bio,
      skills,
      experience,
      rating
    });

    mentorData = {
      ...mentorData,
      bio,
      skills,
      experience,
      rating
    };

    msg.innerText = "Profile updated successfully ✅";
    msg.style.color = "green";

    setTimeout(() => {
      renderProfile(mentorData);
    }, 800);

  } catch (error) {
    console.error(error);
    showEditError("Something went wrong while saving");
  }

  btn.disabled = false;
  btn.innerText = "Save Changes";
}

async function loadMentorProfile() {
  if (!id || id.length < 10) {
    showError("Invalid mentor link ❌", "This profile does not exist or the link is incorrect.");
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      showError("Mentor not found ❌", "This mentor profile may not exist or was removed.");
      return;
    }

    const data = snap.data();

    if (data.role !== "mentor" || data.verified !== true) {
      showError("Mentor not available ❌", "This mentor is not verified or available right now.");
      return;
    }

    mentorData = data;
    renderProfile(mentorData);

  } catch (error) {
    console.error("Error:", error);
    showError("Error loading profile ❌", "Something went wrong while loading this mentor profile.");
  }
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user || null;
  await loadMentorProfile();
});

window.startChat = function(id) {
  alert("Chat feature coming soon 🚀");
};
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
