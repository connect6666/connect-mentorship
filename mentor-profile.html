<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mentor Profile | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 PROFILE LAYOUT
========================= */

.profile-wrapper {
  max-width: 900px;
  margin: 50px auto;
  padding: 0 20px;
}

.profile-card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  padding: 30px;
}

/* HEADER */
.profile-header {
  text-align: center;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  margin-bottom: 10px;
}

.profile-header h2 {
  margin-bottom: 5px;
}

.profile-role {
  color: #64748b;
  font-size: 14px;
}

/* BADGE */
.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.badge.verified {
  background: #16a34a;
  color: white;
}

.badge.pending {
  background: #f59e0b;
  color: white;
}

/* INFO */
.profile-info {
  margin-top: 25px;
  border-top: 1px solid #e2e8f0;
  padding-top: 20px;
}

.info-row {
  margin-bottom: 12px;
  font-size: 15px;
}

/* CTA */
.profile-actions {
  margin-top: 25px;
  text-align: center;
}

.profile-actions .btn {
  margin: 8px;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="container nav-flex">
    <div class="logo">
      <a href="index.html">Connect</a>
    </div>
  </div>
</nav>

<div class="profile-wrapper">

  <div class="profile-card" id="profile">
    Loading...
  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GET ID
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const profile = document.getElementById("profile");

if (!id) {
  profile.innerHTML = "Mentor not found ❌";
} else {

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      profile.innerHTML = "Mentor not found ❌";
    } else {

      const data = snap.data();

      const experienceText = data.experience
        ? data.experience >= 5
          ? data.experience + "+ years"
          : data.experience + " years"
        : "Not added";

      profile.innerHTML = `
        <div class="profile-header">

          <img src="https://ui-avatars.com/api/?name=${data.name}" class="profile-img">

          <h2>${data.name}</h2>

          <div class="profile-role">${data.role || "Mentor"}</div>

          ${
            data.verified
              ? `<div class="badge verified">Verified Mentor</div>`
              : `<div class="badge pending">Pending Verification</div>`
          }

        </div>

        <div class="profile-info">

          <div class="info-row">
            <strong>Experience:</strong> ${experienceText}
          </div>

          <div class="info-row">
            <strong>Phone:</strong> ${data.phone || "Not provided"}
          </div>

        </div>

        <div class="profile-actions">

          <button class="btn" onclick="startChat('${data.phone}')">
            💬 Chat on WhatsApp
          </button>

        </div>
      `;
    }

  } catch (error) {
    console.log(error);
    profile.innerHTML = "Error loading profile ❌";
  }
}

// CHAT
window.startChat = function(phone) {
  if (!phone) {
    alert("Phone not available ❌");
    return;
  }

  window.open(`https://wa.me/${phone}?text=Hi%20I%20found%20you%20on%20Connect%20Mentorship`, "_blank");
};

</script>

</body>
</html>
