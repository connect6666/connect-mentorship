<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Profile | Connect</title>

<link rel="stylesheet" href="style.css">

<style>
.profile-container {
  max-width: 800px;
  margin: 40px auto;
}

.profile-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}

.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin-bottom: 15px;
}

.badge {
  background: #16a34a;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  display: inline-block;
  margin-top: 5px;
}
</style>

</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
  </div>
</nav>

<div class="profile-container">
  <div class="profile-card" id="profile">
    Loading...
  </div>
</div>

<script type="module">

import { initializeApp, getApps, getApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔐 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

/* ✅ FIX: Prevent duplicate Firebase init */
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   GET ID FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const profile = document.getElementById("profile");

/* ❌ INVALID ID CHECK */
if (!id || id.length < 10) {
  profile.innerHTML = "Invalid mentor link ❌";
} else {

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      profile.innerHTML = "Mentor not found ❌";
    } else {

      const data = snap.data();

      /* 🔒 SECURITY: ONLY VERIFIED MENTORS */
      if (data.role !== "mentor" || data.verified !== true) {
        profile.innerHTML = "Mentor not available ❌";
        return;
      }

      /* 🔒 XSS PROTECTION */
      const safeName = (data.name || "User")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      profile.innerHTML = `
        <img src="https://ui-avatars.com/api/?name=${safeName}" class="profile-img">

        <h2>${safeName}</h2>

        <p style="color: gray;">
          Mentor
        </p>

        <div class="badge">Verified Mentor ✅</div>

        <p style="margin-top:15px;">
          Experience: ${
            data.experience
              ? data.experience >= 5
                ? data.experience + "+ years"
                : data.experience + " years"
              : "Not added"
          }
        </p>

        <!-- 🔒 PRIVACY FIX -->
        <p style="color:gray; font-size:13px;">
          Contact available after chat request
        </p>

        <button class="chat-btn" onclick="startChat('${id}')">
          💬 Chat with Mentor
        </button>

        <!-- ⚖️ LEGAL DISCLAIMER -->
        <p style="font-size:10px; color:gray; margin-top:15px;">
          Verification confirms identity only. Connect does not guarantee results or outcomes.
        </p>
      `;
    }

  } catch (error) {
    console.error("Error:", error);
    profile.innerHTML = "Error loading profile ❌";
  }
}

/* =========================
   CHAT BUTTON (SAFE)
========================= */
window.startChat = function(id) {
  alert("Chat feature coming soon 🚀");
};

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
