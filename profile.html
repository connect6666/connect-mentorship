<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/">Connect</a>
    </div>
    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/view-question.html">View Answer</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Become Mentor</a>
      <a href="/connect-mentorship/about.html">About</a>
      <a href="/connect-mentorship/contact.html">Contact</a>
      <a href="/connect-mentorship/my-chats.html">My chats</a>
       <a href="/connect-mentorship/store.html">Store</a>
      
      <span id="userArea"></span>
    </div>
  </div>

<section class="container">
  <h1>Your Profile</h1>
  <p>
    You can also <a href="/connect-mentorship/ask.html">ask questions</a> or 
    <a href="/connect-mentorship/questions.html">browse all questions</a>.
  </p>
  <p>Manage your profile, questions, and answers.</p>
</section>

<div class="profile-card" id="profileCard">Loading...</div>

<div class="profile-section">
  <h3>📌 My Questions</h3>
  <div id="myQuestions"></div>
</div>

<div class="profile-section">
  <h3>💬 My Answers</h3>
  <div id="myAnswers"></div>
</div>

<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  updateDoc,
  setDoc,
  collection,
  query,
  where,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const card = document.getElementById("profileCard");
const myQuestions = document.getElementById("myQuestions");
const myAnswers = document.getElementById("myAnswers");

let currentUser;

/* SAFE HTML */
function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* AUTH */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

 currentUser = user;

if (!user.emailVerified) {
  await signOut(auth);
  alert("Please verify your email before opening profile ❌");
  window.location.href = "/connect-mentorship/login.html";
  return;
  
}

/* PROFILE */
onSnapshot(doc(db, "users", user.uid), async (snap) => {

    const data = snap.exists() ? snap.data() : {};
  if (data.banned === true) {
  await signOut(auth);
  alert("Your account is banned ❌");
  window.location.href = "/connect-mentorship/login.html";
  return;
}
  const name = escapeHTML(data.name || "User");

   const role = data.role || "student";
const verified = data.verified || false;
const phone = data.phone || "";
const profileComplete = data.profileComplete === true;

    card.innerHTML = `
      <img src="https://ui-avatars.com/api/?name=${name}" class="profile-img">

      <h2>${name}</h2>
      <p>${user.email}</p>


      ${
  profileComplete
    ? `<div class="badge">Profile Complete ✅</div>`
    : `<div class="badge" style="background:#f59e0b;">Profile Incomplete ⚠️</div>`
}

      ${
        role === "mentor"
          ? `<div class="badge">Mentor ${verified ? "✅ Verified" : "⏳ Pending"}</div>`
          : `<button class="btn" onclick="applyVerification()">Become Mentor</button>`
      }

      <input id="editName" value="${name}">
      <input id="editPhone" placeholder="Phone number" value="${phone}">

      <p style="font-size:12px;color:gray;">
        Your phone will only be shared after connection approval.
      </p>

      <button id="saveBtn" class="btn">Save</button>
      <button class="btn btn-outline" onclick="logout()">Logout</button>
    `;

    document.getElementById("saveBtn").onclick = saveProfile;
  });

  /* LOAD QUESTIONS */
  myQuestions.innerHTML = "";
  const qSnap = await getDocs(
    query(collection(db, "questions"), where("userId", "==", user.uid))
  );

  qSnap.forEach(doc => {
    myQuestions.innerHTML += `
      <div class="step-card">
        ${escapeHTML(doc.data().question)}
      </div>
    `;
  });

  if (!qSnap.size) {
    myQuestions.innerHTML = "No questions yet.";
  }

  /* LOAD ANSWERS */
  myAnswers.innerHTML = "";
  const aSnap = await getDocs(
    query(collection(db, "answers"), where("userId", "==", user.uid))
  );

  aSnap.forEach(doc => {
    myAnswers.innerHTML += `
      <div class="step-card">
        ${escapeHTML(doc.data().text)}
      </div>
    `;
  });

  if (!aSnap.size) {
    myAnswers.innerHTML = "No answers yet.";
  }

});

/* SAVE */
async function saveProfile() {
  const name = document.getElementById("editName").value.trim();
  const phone = document.getElementById("editPhone").value.trim();

  if (!name) {
    alert("Name required ❌");
    return;
  }

await setDoc(doc(db, "users", currentUser.uid), {
  name,
  phone,
  email: currentUser.email,
  profileComplete: true,
  updatedAt: new Date()
}, { merge: true });

alert("Profile updated ✅");
}



/* APPLY */
window.applyVerification = async function() {
 await setDoc(doc(db, "users", currentUser.uid), {
  email: currentUser.email,
  role: "mentor",
  verified: false,
  profileComplete: true,
  updatedAt: new Date()
}, { merge: true });

  alert("Applied for mentor ✅");
};

/* LOGOUT */
window.logout = async function() {
  await signOut(auth);
  window.location.href = "/connect-mentorship/";
};

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
