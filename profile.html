<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Connect</title>
<link rel="stylesheet" href="style.css">

<style>

/* PROFILE CARD */
.profile-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
  max-width: 500px;
  margin: 40px auto;
}

/* PROFILE IMAGE */
.profile-img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 15px;
}

/* BADGE */
.badge {
  display: inline-block;
  background: #4f46e5;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-top: 5px;
}

/* INPUT */
.profile-card input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* BUTTONS */
.profile-card .btn {
  margin-top: 15px;
}

.profile-section {
  max-width: 800px;
  margin: 40px auto;
}

.profile-section h3 {
  margin-bottom: 15px;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="profile.html">Profile</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<!-- PROFILE -->
<section>

<div class="profile-card" id="profileCard">
  Loading...
</div>

<div class="profile-section">
  <h3>📌 My Questions</h3>
  <div id="myQuestions"></div>
</div>

<div class="profile-section">
  <h3>💬 My Answers</h3>
  <div id="myAnswers"></div>
</div>

</section>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, updateDoc,
  collection, getDocs, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const card = document.getElementById("profileCard");
const myQuestions = document.getElementById("myQuestions");
const myAnswers = document.getElementById("myAnswers");

let currentUser;

onAuthStateChanged(auth, async (user) => {

  if (!user) return window.location.href = "login.html";

  currentUser = user;

  
onSnapshot(doc(db, "users", user.uid), (snap) => {

  let data = snap.exists() ? snap.data() : {};

  const name = data.name || "User";
  const role = data.role || "user";
  const verified = data.verified || false;
  const phone = data.phone || "";

  card.innerHTML = `
    <img src="https://ui-avatars.com/api/?name=${name}" class="profile-img">

    <h2>${name}</h2>
    <p>${user.email}</p>

    ${
      role === "mentor"
        ? `
        <div class="badge">
          Mentor ${verified ? "✅ Verified" : "⏳ Pending"}
        </div>

        ${
          !verified
            ? `<button class="btn" onclick="applyVerification()">Apply for Verification</button>`
            : ""
        }
      `
        : `
        <button class="btn" onclick="applyVerification()">Become Mentor</button>
      `
    }

    <input id="editName" value="${name}">
    <input id="editPhone" placeholder="Phone number" value="${phone}">

    <button class="btn" onclick="saveProfile()">Save</button>
    <button class="btn btn-outline" onclick="logout()">Logout</button>
  `;
});

  // LOAD ANSWERS
  const aSnap = await getDocs(
    query(collection(db,"answers"), where("userId","==",user.uid))
  );

  aSnap.forEach(doc=>{
    myAnswers.innerHTML += `
      <div class="step-card">
        ${doc.data().text}
      </div>
    `;
  });

});

// SAVE PROFILE
window.saveProfile = async function() {
  const name = document.getElementById("editName").value;
  const phone = document.getElementById("editPhone").value;

  await updateDoc(doc(db, "users", currentUser.uid), {
    name,
    phone
  });

  alert("Profile updated ✅");
  location.reload();
};

// APPLY MENTOR
window.applyVerification = async function() {

  const snap = await getDoc(doc(db, "users", currentUser.uid));
  const data = snap.data();

  if (data.role === "mentor" && data.verified === false) {
    return alert("Already applied ⏳");
  }

  await updateDoc(doc(db, "users", currentUser.uid), {
    role: "mentor",
    verified: false
  });

  alert("Applied for mentor ✅");
  location.reload();
};

// LOGOUT
window.logout = async function() {
  await signOut(auth);
  window.location.href = "index.html";
};

</script>

</body>
</html>
