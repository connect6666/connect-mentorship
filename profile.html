<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 LAYOUT
========================= */

.dashboard {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

/* PROFILE CARD */
.profile-card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
}

/* IMAGE */
.profile-img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin-bottom: 10px;
}

/* BADGE */
.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
}

.badge.mentor {
  background: #4f46e5;
  color: white;
}

.badge.pending {
  background: #f59e0b;
  color: white;
}

/* ACTIONS */
.profile-actions {
  margin-top: 15px;
}

.profile-actions .btn {
  margin: 5px;
}

/* EDIT */
.profile-edit {
  margin-top: 20px;
}

.profile-edit input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

/* ACTIVITY */
.section {
  margin-top: 40px;
}

.section h3 {
  margin-bottom: 15px;
}

.activity-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

</style>

</head>

<body>

<nav>
  <div class="container nav-flex">
    <div class="logo"><a href="index.html">Connect</a></div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>
</nav>

<div class="dashboard">

  <!-- PROFILE -->
  <div class="profile-card" id="profileCard">Loading...</div>

  <!-- QUESTIONS -->
  <div class="section">
    <h3>📌 My Questions</h3>
    <div id="myQuestions"></div>
  </div>

  <!-- ANSWERS -->
  <div class="section">
    <h3>💬 My Answers</h3>
    <div id="myAnswers"></div>
  </div>

</div>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, updateDoc,
  collection, getDocs, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const card = document.getElementById("profileCard");
const myAnswers = document.getElementById("myAnswers");
const myQuestions = document.getElementById("myQuestions");

let currentUser;

onAuthStateChanged(auth, async (user) => {

  if (!user) return window.location.href = "login.html";

  currentUser = user;

  onSnapshot(doc(db, "users", user.uid), (snap) => {

    let data = snap.exists() ? snap.data() : {};

    const name = data.name || "User";
    const role = data.role || "user";
    const verified = data.verified || false;
    const phone = data.phone || "";

    card.innerHTML = `
      <img src="https://ui-avatars.com/api/?name=${name}" class="profile-img">

      <h2>${name}</h2>
      <p>${user.email}</p>

      ${
        role === "mentor"
          ? verified
            ? `<div class="badge mentor">Verified Mentor</div>`
            : `<div class="badge pending">Mentor Pending</div>`
          : ""
      }

      <div class="profile-actions">
        ${
          role !== "mentor"
            ? `<button class="btn" onclick="applyVerification()">Become Mentor</button>`
            : !verified
            ? `<button class="btn">Application Pending</button>`
            : ""
        }

        <button class="btn btn-outline" onclick="logout()">Logout</button>
      </div>

      <div class="profile-edit">
        <input id="editName" value="${name}">
        <input id="editPhone" placeholder="Phone number" value="${phone}">
        <button class="btn" onclick="saveProfile()">Save Changes</button>
      </div>
    `;
  });

  // ANSWERS
  const aSnap = await getDocs(
    query(collection(db,"answers"), where("userId","==",user.uid))
  );

  aSnap.forEach(doc=>{
    myAnswers.innerHTML += `<div class="activity-card">${doc.data().text}</div>`;
  });

  // QUESTIONS (optional if you store userId)
});

window.saveProfile = async function() {
  const name = editName.value;
  const phone = editPhone.value;

  await updateDoc(doc(db, "users", currentUser.uid), {
    name,
    phone
  });

  alert("Profile updated ✅");
};

window.applyVerification = async function() {

  const snap = await getDoc(doc(db, "users", currentUser.uid));
  const data = snap.data();

  if (data.role === "mentor" && data.verified === false) {
    return alert("Already applied ⏳");
  }

  await updateDoc(doc(db, "users", currentUser.uid), {
    role: "mentor",
    verified: false
  });

  alert("Applied for mentor ✅");
};

window.logout = async function() {
  await signOut(auth);
  window.location.href = "index.html";
};

</script>

</body>
</html>
