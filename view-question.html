<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Question | Connect</title>

<link rel="stylesheet" href="style.css">

<style>
.container {
  max-width: 800px;
  margin: 40px auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
}

.answer {
  border-top: 1px solid #eee;
  padding-top: 10px;
  margin-top: 10px;
}

textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="questions.html">Questions</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="container">

  <!-- QUESTION -->
  <div class="card" id="questionBox">Loading...</div>

  <!-- ANSWER BOX -->
  <div class="card" id="answerBox" style="display:none;">
    <h3>Write Answer</h3>
    <textarea id="answerText" placeholder="Write your answer..."></textarea>
    <button id="answerBtn">Submit Answer</button>
    <p id="msg"></p>
  </div>

  <!-- ANSWERS -->
  <div id="answersList"></div>

</div>

<script type="module">

/* ✅ USE SHARED AUTH + DB */
import { auth, db } from "./auth.js";

import {
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================
   GLOBAL
========================= */
const params = new URLSearchParams(window.location.search);
const qId = params.get("id");

const questionBox = document.getElementById("questionBox");
const answersList = document.getElementById("answersList");
const answerBox = document.getElementById("answerBox");
const msg = document.getElementById("msg");
const btn = document.getElementById("answerBtn");

let currentUserData = null;

/* =========================
   SAFE HTML
========================= */
function escapeHTML(str) {
  return (str || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* =========================
   LOAD QUESTION
========================= */
async function loadQuestion() {

  if (!qId) {
    questionBox.innerHTML = "Invalid question ❌";
    return;
  }

  const snap = await getDoc(doc(db, "questions", qId));

  if (!snap.exists()) {
    questionBox.innerHTML = "Question not found ❌";
    return;
  }

  const q = snap.data();

  questionBox.innerHTML = `
    <h2>${escapeHTML(q.question)}</h2>
    <p>${escapeHTML(q.name || "User")} | ${escapeHTML(q.category || "General")}</p>
  `;
}

/* =========================
   LOAD ANSWERS (OPTIMIZED)
========================= */
function loadAnswers() {

  const qRef = query(
    collection(db, "answers"),
    where("questionId", "==", qId),
    orderBy("createdAt", "desc")
  );

  onSnapshot(qRef, (snap) => {

    answersList.innerHTML = "<h3>Answers</h3>";

    if (snap.empty) {
      answersList.innerHTML += "<p>No answers yet</p>";
      return;
    }

    snap.forEach(docSnap => {

      const data = docSnap.data();

      const div = document.createElement("div");
      div.className = "card answer";

      div.innerHTML = `
        <p>${escapeHTML(data.text)}</p>
        <small>${escapeHTML(data.name || "User")}</small>
        <br>
        <button onclick="reportAnswer('${docSnap.id}')">Report</button>
      `;

      answersList.appendChild(div);
    });

  });
}

/* =========================
   SUBMIT ANSWER
========================= */
btn.onclick = async () => {

  const text = document.getElementById("answerText").value.trim();

  const badWords = ["badword1","badword2"];

  // disable button
  btn.disabled = true;
  btn.innerText = "Posting...";

  if (!text) {
    msg.innerText = "Write something ❌";
    resetBtn();
    return;
  }

  if (badWords.some(w => text.toLowerCase().includes(w))) {
    msg.innerText = "Keep it respectful ❌";
    resetBtn();
    return;
  }

  try {
    const user = auth.currentUser;

    await addDoc(collection(db, "answers"), {
      text,
      questionId: qId,
      userId: user.uid,
      name: currentUserData?.name || user.email,
      createdAt: serverTimestamp()
    });

    msg.innerText = "Answer added ✅";
    document.getElementById("answerText").value = "";

  } catch (e) {
    msg.innerText = "Error ❌";
  }

  resetBtn();
};

function resetBtn() {
  btn.disabled = false;
  btn.innerText = "Submit Answer";
}

/* =========================
   REPORT
========================= */
window.reportAnswer = function(id) {
  alert("Reported 🚨");
};

/* =========================
   AUTH CHECK
========================= */
onAuthStateChanged(auth, async (user) => {

  if (!user) return;

  const snap = await getDoc(doc(db, "users", user.uid));

  if (snap.exists()) {

    const data = snap.data();
    currentUserData = data;

    // 🔥 ONLY VERIFIED MENTOR
    if (data.role === "mentor" && data.verified === true) {
      answerBox.style.display = "block";
    }
  }
});

/* =========================
   INIT
========================= */
loadQuestion();
loadAnswers();

</script>

<!-- ✅ SHARED AUTH NAVBAR -->
<script type="module" src="auth.js"></script>

</body>
</html>
