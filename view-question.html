<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Question & Answers | Connect Mentorship</title>

<meta name="description" content="Read student questions and answers about career, exams, and college guidance.">

<link rel="canonical" href="https://connect6666.github.io/connect-mentorship/view-question.html">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="/connect-mentorship/icon.png">

</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/">Connect</a>
    </div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Become Mentor</a>
      <a href="/connect-mentorship/about.html">About</a>
      <a href="/connect-mentorship/contact.html">Contact</a>
      <a href="questions.html">Questions</a>
      <a href="view-question.html">View Questions</a>
      <a href="profile.html">Profile</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<section class="container">
  <h1>Student Question and Answers</h1>
</section>

<div class="container">

  <div class="card" id="questionBox">Loading...</div>

  <div class="card" id="answerBox" style="display:none;">
    <h3>Write Answer</h3>
    <textarea id="answerText"></textarea>
    <button id="answerBtn">Submit Answer</button>
    <p id="msg"></p>
  </div>

  <div id="answersList"></div>

</div>

<script type="module">

import { auth, db } from "./auth.js";
import {
  doc, getDoc, collection, addDoc, query, where,
  onSnapshot, serverTimestamp, orderBy,
  updateDoc, increment, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* SAFE ID */
const qId = new URLSearchParams(window.location.search).get("id");

if (!qId) {
  document.getElementById("questionBox").innerHTML = "Invalid question link ❌";
  throw new Error("No question ID");
}

const questionBox = document.getElementById("questionBox");
const answersList = document.getElementById("answersList");
const answerBox = document.getElementById("answerBox");
const msg = document.getElementById("msg");
const btn = document.getElementById("answerBtn");

let currentUserData = null;
let replyListeners = {};

/* SAFE HTML */
function escapeHTML(str) {
  return (str || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}

/* LOAD QUESTION */
async function loadQuestion() {
  const snap = await getDoc(doc(db, "questions", qId));

  if (!snap.exists()) {
    questionBox.innerHTML = "Question not found ❌";
    return;
  }

  const q = snap.data();

  questionBox.innerHTML = `
    <h2>${escapeHTML(q.question)}</h2>
    <p>${escapeHTML(q.name)}</p>
  `;
}

/* LOAD ANSWERS */
function loadAnswers() {

  const qRef = query(
    collection(db, "answers"),
    where("questionId","==",qId),
    orderBy("createdAt","desc")
  );

  onSnapshot(qRef, snap => {

    answersList.innerHTML = "<h3>Answers</h3>";

    snap.forEach(docSnap => {

      const d = docSnap.data();
      const id = docSnap.id;

      const upvotedBy = d.upvotedBy || [];
      const voted = upvotedBy.includes(auth.currentUser?.uid);

      const div = document.createElement("div");
      div.className = "card answer";

      div.innerHTML = `
        <p>${escapeHTML(d.text)}</p>
        <small>${escapeHTML(d.name)}</small><br><br>

        <button onclick="upvote('${id}')"
          style="opacity:${voted ? 0.5 : 1}; pointer-events:${voted ? 'none' : 'auto'};">
          👍 ${d.votes || 0}
        </button>

        <button id="btn-${id}" onclick="toggleReplies('${id}')">
          View Replies
        </button>

        <div>
          <textarea id="replyText-${id}" placeholder="Write reply..."></textarea>
          <button onclick="submitReply('${id}')">Reply</button>
        </div>

        <div id="replies-${id}" style="display:none;"></div>
      `;

      answersList.appendChild(div);
    });

  });
}

/* SUBMIT ANSWER */
btn.onclick = async () => {
  const text = document.getElementById("answerText").value.trim();
  if (!text) return msg.innerText="Write something ❌";

  const user = auth.currentUser;

  await addDoc(collection(db,"answers"),{
    text,
    questionId:qId,
    userId:user.uid,
    name: currentUserData?.name || user.email,
    createdAt:serverTimestamp(),
    votes: 0,
    upvotedBy: []
  });

  msg.innerText="Answer added ✅";
  document.getElementById("answerText").value="";
};

/* UPVOTE */
window.upvote = async function(answerId) {
  const user = auth.currentUser;
  if (!user) return alert("Login required ❌");

  const ref = doc(db, "answers", answerId);
  const snap = await getDoc(ref);

  const data = snap.data();
  if ((data.upvotedBy || []).includes(user.uid)) return;

  await updateDoc(ref, {
    votes: increment(1),
    upvotedBy: arrayUnion(user.uid)
  });
};

/* TOGGLE REPLIES */
window.toggleReplies = function(answerId){

  const box = document.getElementById(`replies-${answerId}`);
  const btn = document.getElementById(`btn-${answerId}`);

  const isOpen = box.dataset.open === "true";

  if (isOpen) {
    box.style.display = "none";
    box.dataset.open = "false";
    btn.innerText = "View Replies";

    if (replyListeners[answerId]) {
      replyListeners[answerId]();
      delete replyListeners[answerId];
    }
    return;
  }

  box.style.display = "block";
  box.dataset.open = "true";
  btn.innerText = "Hide Replies";

  const ref = query(
    collection(db,"replies"),
    where("answerId","==",answerId),
    orderBy("createdAt","asc")
  );

  const unsubscribe = onSnapshot(ref, snap => {
    box.innerHTML = "";
    snap.forEach(docSnap=>{
      const d = docSnap.data();
      box.innerHTML += `
        <p>💬 ${escapeHTML(d.text)}<br>
        <small>${escapeHTML(d.name)}</small></p>
      `;
    });
  });

  replyListeners[answerId] = unsubscribe;
};

/* SUBMIT REPLY */
window.submitReply = async function(answerId){

  const user = auth.currentUser;
  if (!user) return alert("Login required ❌");

  const el = document.getElementById(`replyText-${answerId}`);
  const text = el.value.trim();

  if (!text) return alert("Write reply ❌");

  await addDoc(collection(db,"replies"),{
    text,
    answerId,
    userId:user.uid,
    name: currentUserData?.name || user.email,
    createdAt:serverTimestamp()
  });

  el.value="";
};

/* AUTH */
onAuthStateChanged(auth, async user=>{
  if(!user) return;

  const snap = await getDoc(doc(db,"users",user.uid));

  if(snap.exists()){
    currentUserData = snap.data();

    if(currentUserData.role==="mentor" && currentUserData.verified){
      answerBox.style.display="block";
    }
  }
});

/* INIT */
loadQuestion();
loadAnswers();

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
