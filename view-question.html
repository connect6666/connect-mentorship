<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Question | Connect</title>

<link rel="stylesheet" href="style.css">

<style>
.container {
  max-width: 800px;
  margin: 40px auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
}

.answer {
  border-top: 1px solid #eee;
  padding-top: 10px;
  margin-top: 10px;
}

textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="questions.html">Questions</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="container">

  <!-- QUESTION -->
  <div class="card" id="questionBox">Loading...</div>

  <!-- ANSWER BOX -->
  <div class="card" id="answerBox" style="display:none;">
    <h3>Write Answer</h3>
    <textarea id="answerText" placeholder="Write your answer..."></textarea>
    <button id="answerBtn">Submit Answer</button>
    <p id="msg"></p>
  </div>

  <!-- ANSWERS -->
  <div id="answersList"></div>

</div>

<script type="module">

/* ✅ SHARED AUTH */
import { auth, db } from "./auth.js";

import {
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  orderBy,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* GLOBAL */
const params = new URLSearchParams(window.location.search);
const qId = params.get("id");

const questionBox = document.getElementById("questionBox");
const answersList = document.getElementById("answersList");
const answerBox = document.getElementById("answerBox");
const msg = document.getElementById("msg");
const btn = document.getElementById("answerBtn");

let currentUserData = null;

/* SAFE HTML */
function escapeHTML(str) {
  return (str || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

/* LOAD QUESTION */
async function loadQuestion() {

  if (!qId) {
    questionBox.innerHTML = "Invalid question ❌";
    return;
  }

  const snap = await getDoc(doc(db, "questions", qId));

  if (!snap.exists()) {
    questionBox.innerHTML = "Question not found ❌";
    return;
  }

  const q = snap.data();

  questionBox.innerHTML = `
    <h2>${escapeHTML(q.question)}</h2>
    <p>${escapeHTML(q.name || "User")} | ${escapeHTML(q.category || "General")}</p>
  `;
}

/* LOAD ANSWERS */
function loadAnswers() {

  const qRef = query(
    collection(db, "answers"),
    where("questionId", "==", qId),
    orderBy("createdAt", "desc")
  );

  onSnapshot(qRef, (snap) => {

    answersList.innerHTML = "<h3>Answers</h3>";

    if (snap.empty) {
      answersList.innerHTML += "<p>No answers yet</p>";
      return;
    }

    snap.forEach(docSnap => {

      const data = docSnap.data();

      const div = document.createElement("div");
      div.className = "card answer";

      div.innerHTML = `
        <p>${escapeHTML(data.text)}</p>
        <small>${escapeHTML(data.name || "User")}</small>

        <br><br>

        <!-- 👍 UPVOTE -->
        <button onclick="upvote('${docSnap.id}')">
          👍 ${data.votes || 0}
        </button>

        <!-- 💬 LOAD REPLIES -->
        <button onclick="loadReplies('${docSnap.id}')">
          View Replies
        </button>

        <!-- 🚨 REPORT -->
        <button onclick="reportAnswer('${docSnap.id}')">Report</button>

        <!-- REPLY BOX -->
        <div>
          <textarea id="replyText-${docSnap.id}" placeholder="Write reply..."></textarea>
          <button onclick="submitReply('${docSnap.id}')">Reply</button>
        </div>

        <!-- REPLIES -->
        <div id="replies-${docSnap.id}"></div>
      `;

      answersList.appendChild(div);
    });

  });
}

/* SUBMIT ANSWER */
btn.onclick = async () => {

  const text = document.getElementById("answerText").value.trim();

  btn.disabled = true;
  btn.innerText = "Posting...";

  if (!text) {
    msg.innerText = "Write something ❌";
    resetBtn();
    return;
  }

  try {
    const user = auth.currentUser;

    await addDoc(collection(db, "answers"), {
      text,
      questionId: qId,
      userId: user.uid,
      name: currentUserData?.name || user.email,
      createdAt: serverTimestamp()
    });

    msg.innerText = "Answer added ✅";
    document.getElementById("answerText").value = "";

  } catch (e) {
    msg.innerText = "Error ❌";
  }

  resetBtn();
};

function resetBtn() {
  btn.disabled = false;
  btn.innerText = "Submit Answer";
}

/* UPVOTE */
window.upvote = async function(id) {
  await updateDoc(doc(db, "answers", id), {
    votes: increment(1)
  });
};

/* LOAD REPLIES */
window.loadReplies = function(answerId) {

  const ref = query(
    collection(db, "replies"),
    where("answerId", "==", answerId),
    orderBy("createdAt", "asc")
  );

  onSnapshot(ref, (snap) => {

    const container = document.getElementById(`replies-${answerId}`);
    container.innerHTML = "";

    snap.forEach(docSnap => {
      const d = docSnap.data();

      container.innerHTML += `
        <p>💬 ${escapeHTML(d.text)} <br>
        <small>${escapeHTML(d.name || "User")}</small></p>
      `;
    });

  });
};

/* SUBMIT REPLY */
window.submitReply = async function(answerId) {

  const textEl = document.getElementById(`replyText-${answerId}`);
  const text = textEl.value.trim();

  if (!text) return alert("Write reply ❌");

  const user = auth.currentUser;

  await addDoc(collection(db, "replies"), {
    text,
    answerId,
    userId: user.uid,
    name: currentUserData?.name || user.email,
    createdAt: serverTimestamp()
  });

  textEl.value = "";
};

/* REPORT */
window.reportAnswer = function(id) {
  alert("Reported 🚨");
};

/* AUTH */
onAuthStateChanged(auth, async (user) => {

  if (!user) return;

  const snap = await getDoc(doc(db, "users", user.uid));

  if (snap.exists()) {

    const data = snap.data();
    currentUserData = data;

    if (data.role === "mentor" && data.verified === true) {
      answerBox.style.display = "block";
    }
  }
});

/* INIT */
loadQuestion();
loadAnswers();

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
