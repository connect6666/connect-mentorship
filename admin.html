<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | Connect Mentorship</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-section {
      max-width: 1100px;
      margin: 40px auto;
    }

    .data-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }

    .danger-btn {
      background: #ef4444;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .success-btn {
      background: #16a34a;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    #loginBox {
      text-align: center;
      margin-top: 120px;
    }

    input {
      padding: 10px;
      width: 250px;
    }

    .status {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="password" id="adminPass" placeholder="Enter password">
  <br><br>
  <button class="btn" onclick="checkLogin()">Login</button>
  <p id="loginMsg" style="color:red;"></p>
</div>

<div id="adminContent" style="display:none;">

<nav>
  <div class="container">
    <div class="logo">Connect Admin</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <button onclick="logout()" class="btn">Logout</button>
    </div>
  </div>
</nav>

<section class="admin-section">
  <h2>Mentor Applications</h2>
  <div id="mentorsList">Loading...</div>
</section>

<section class="admin-section">
  <h2>Questions</h2>
  <div id="questionsList">Loading...</div>
</section>

<section class="admin-section">
  <h2>Contact Messages</h2>
  <div id="contactsList">Loading...</div>
</section>

<footer style="text-align:center;">
  <p>© 2026 Connect Mentorship Admin</p>
</footer>

</div>

<script>
const ADMIN_PASSWORD = "connect@2026#admin";

function checkLogin() {
  const pass = document.getElementById("adminPass").value;

  if (pass === ADMIN_PASSWORD) {
    localStorage.setItem("adminAuth", "true");
    showAdmin();
  } else {
    document.getElementById("loginMsg").innerText = "Wrong password ❌";
  }
}

function showAdmin() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminContent").style.display = "block";
}

function logout() {
  localStorage.removeItem("adminAuth");
  location.reload();
}

if (localStorage.getItem("adminAuth") === "true") {
  window.onload = showAdmin;
}
</script>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

async function loadMentors() {
  const container = document.getElementById("mentorsList");
  const snap = await getDocs(collection(db, "mentorApplications"));

  container.innerHTML = "";

  if (snap.empty) {
    container.innerHTML = "<p>No mentor applications found.</p>";
    return;
  }

  snap.forEach((docSnap) => {
    const m = docSnap.data();
    const id = docSnap.id;

    const status = m.status || "pending";

    container.innerHTML += `
      <div class="data-card">
        <h4>${escapeHTML(m.name || "No name")}</h4>
        <p><strong>Email:</strong> ${escapeHTML(m.email || "No email")}</p>
        <p><strong>Level:</strong> ${escapeHTML(m.level || "Not added")}</p>
        <p><strong>Experience:</strong> ${escapeHTML(m.experience || 0)} years</p>
        <p><strong>Reason:</strong> ${escapeHTML(m.reason || "Not added")}</p>
        <p class="status"><strong>Status:</strong> ${escapeHTML(status)}</p>

        ${
          status === "approved"
          ? `<p style="color:green;font-weight:bold;">Approved ✅</p>`
          : `<button class="success-btn" onclick="approveMentor('${id}', '${m.userId || ""}')">Approve Mentor</button>`
        }

        <button class="danger-btn" onclick="deleteItem('mentorApplications','${id}')">Delete</button>
      </div>
    `;
  });
}

async function loadQuestions() {
  const container = document.getElementById("questionsList");
  const snap = await getDocs(collection(db, "questions"));

  container.innerHTML = "";

  if (snap.empty) {
    container.innerHTML = "<p>No questions found.</p>";
    return;
  }

  snap.forEach((docSnap) => {
    const q = docSnap.data();
    const id = docSnap.id;

    container.innerHTML += `
      <div class="data-card">
        <h4>${escapeHTML(q.question || "No question")}</h4>
        <p><strong>Name:</strong> ${escapeHTML(q.name || "User")}</p>
        <p><strong>Category:</strong> ${escapeHTML(q.category || "Not added")}</p>
        <button class="danger-btn" onclick="deleteItem('questions','${id}')">Delete</button>
      </div>
    `;
  });
}

async function loadContacts() {
  const container = document.getElementById("contactsList");
  const snap = await getDocs(collection(db, "contactMessages"));

  container.innerHTML = "";

  if (snap.empty) {
    container.innerHTML = "<p>No contact messages found.</p>";
    return;
  }

  snap.forEach((docSnap) => {
    const c = docSnap.data();
    const id = docSnap.id;

    container.innerHTML += `
      <div class="data-card">
        <h4>${escapeHTML(c.name || "No name")}</h4>
        <p><strong>Email:</strong> ${escapeHTML(c.email || "No email")}</p>
        <p><strong>Message:</strong> ${escapeHTML(c.message || "No message")}</p>
        <button class="danger-btn" onclick="deleteItem('contactMessages','${id}')">Delete</button>
      </div>
    `;
  });
}

window.approveMentor = async function(applicationId, userId) {
  if (!userId) {
    alert("This application has no user ID. Ask mentor to apply again after login.");
    return;
  }

  try {
    const applicationRef = doc(db, "mentorApplications", applicationId);
    const applicationSnap = await getDoc(applicationRef);

    if (!applicationSnap.exists()) {
      alert("Application not found ❌");
      return;
    }

    const data = applicationSnap.data();

    await updateDoc(doc(db, "users", userId), {
      role: "mentor",
      verified: true,
      name: data.name || "Mentor",
      email: data.email || "",
      level: data.level || "",
      experience: Number(data.experience || 0),
      mentorReason: data.reason || "",
      approvedAt: new Date()
    });

    await updateDoc(applicationRef, {
      status: "approved",
      approvedAt: new Date()
    });

    alert("Mentor approved ✅");
    loadMentors();

  } catch (error) {
    console.error(error);
    alert("Approval failed ❌");
  }
};

window.deleteItem = async function(collectionName, id) {
  if (!confirm("Delete this item?")) return;

  try {
    await deleteDoc(doc(db, collectionName, id));

    loadMentors();
    loadQuestions();
    loadContacts();

  } catch (error) {
    console.error(error);
    alert("Delete failed ❌");
  }
};

loadMentors();
loadQuestions();
loadContacts();
</script>

</body>
</html>
