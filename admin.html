<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Connect Mentorship</title>

<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">

<style>

.admin-section {
  max-width: 1100px;
  margin: 40px auto;
}

.data-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.actions {
  margin-top: 10px;
}

.btn {
  margin-right: 10px;
}

.approve-btn {
  background: #16a34a;
}

.danger-btn {
  background: #ef4444;
}

#loginBox {
  text-align: center;
  margin-top: 120px;
}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="password" id="adminPass" placeholder="Enter password">
  <br><br>
  <button class="btn" onclick="checkLogin()">Login</button>
  <p id="loginMsg"></p>
</div>

<!-- ADMIN -->
<div id="adminContent" style="display:none;">

<nav>
  <div class="container nav-flex">
    <div class="logo">Admin Panel</div>
    <button onclick="logout()" class="btn">Logout</button>
  </div>
</nav>

<section class="admin-section">
  <h2>Mentor Applications</h2>
  <div id="mentorsList"></div>
</section>

<section class="admin-section">
  <h2>Questions</h2>
  <div id="questionsList"></div>
</section>

<footer style="text-align:center;">
  <p>© 2026 Connect Mentorship Admin</p>
</footer>

</div>

<script>
const ADMIN_PASSWORD = "connect@2026#admin";

function checkLogin() {
  const pass = adminPass.value;

  if (pass === ADMIN_PASSWORD) {
    localStorage.setItem("adminAuth", "true");
    showAdmin();
  } else {
    loginMsg.innerText = "Wrong password ❌";
  }
}

function showAdmin() {
  loginBox.style.display = "none";
  adminContent.style.display = "block";
}

function logout() {
  localStorage.removeItem("adminAuth");
  location.reload();
}

if (localStorage.getItem("adminAuth") === "true") {
  window.onload = showAdmin;
}
</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   🔥 LOAD MENTOR APPLICATIONS
========================= */

async function loadMentors() {
  const container = document.getElementById("mentorsList");
  const snap = await getDocs(collection(db, "mentorApplications"));

  container.innerHTML = "";

  snap.forEach(docSnap => {
    const m = docSnap.data();
    const id = docSnap.id;

    container.innerHTML += `
      <div class="data-card">
        <h3>${m.name}</h3>
        <p>${m.email}</p>
        <p>Experience: ${m.experience || 0} years</p>

        <div class="actions">
          <button class="btn approve-btn" onclick="approveMentor('${id}')">
            Approve
          </button>

          <button class="btn danger-btn" onclick="deleteItem('mentorApplications','${id}')">
            Reject
          </button>
        </div>
      </div>
    `;
  });
}

/* =========================
   ✅ APPROVE MENTOR
========================= */

window.approveMentor = async function(id) {

  const snap = await getDocs(collection(db, "mentorApplications"));
  let selected;

  snap.forEach(docSnap => {
    if (docSnap.id === id) {
      selected = docSnap.data();
    }
  });

  if (!selected) return alert("Error");

  // 🔥 CREATE USER
  const newId = Date.now().toString();

  await setDoc(doc(db, "users", newId), {
    name: selected.name,
    email: selected.email,
    role: "mentor",
    verified: true,
    experience: Number(selected.experience) || 0,
    phone: selected.phone || ""
  });

  // 🔥 DELETE APPLICATION
  await deleteDoc(doc(db, "mentorApplications", id));

  alert("Mentor approved ✅");

  loadMentors();
};

/* =========================
   QUESTIONS
========================= */

async function loadQuestions() {
  const container = document.getElementById("questionsList");
  const snap = await getDocs(collection(db, "questions"));

  container.innerHTML = "";

  snap.forEach(docSnap => {
    const q = docSnap.data();
    const id = docSnap.id;

    container.innerHTML += `
      <div class="data-card">
        <p>${q.question}</p>
        <button class="btn danger-btn" onclick="deleteItem('questions','${id}')">
          Delete
        </button>
      </div>
    `;
  });
}

/* DELETE */
window.deleteItem = async function(col, id) {
  await deleteDoc(doc(db, col, id));
  loadMentors();
  loadQuestions();
};

/* INIT */
loadMentors();
loadQuestions();

</script>

</body>
</html>
