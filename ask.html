<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask a Question | Connect Mentorship</title>

  <link rel="canonical" href="https://connect6666.github.io/connect-mentorship/ask.html">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask Question</a>
      <a href="mentor.html">Become Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="questions.html">Questions</a>

      <span id="userArea"></span>
    </div>
  </div>
</nav>

<!-- ASK SECTION -->
<section class="page-section">
  <div class="container">

    <h2>Ask Your Question</h2>

    <!-- LOGIN PROMPT -->
    <p style="font-size:14px; color:gray; text-align:center;">
      Asking as guest. <a href="login.html">Login</a> to track your question.
    </p>

    <!-- QUESTION FORM -->
    <form id="questionForm" class="question-form">

      <!-- Honeypot (anti-bot) -->
      <input type="text" id="website" style="display:none">

      <input type="text" id="name" placeholder="Your Name (optional)">
      <input type="email" id="email" placeholder="Email (optional)">

      <select id="category" required>
        <option value="">Select Category</option>
        <option>Exams</option>
        <option>College Life</option>
        <option>Career</option>
        <option>Skills</option>
      </select>

      <textarea id="question" maxlength="500" placeholder="Write your question (max 500 chars)..." required></textarea>

      <!-- CONSENT -->
      <label style="font-size:14px;">
        <input type="checkbox" id="consent" required>
        I agree to the Privacy Policy and allow Connect to contact me.
      </label>

      <button type="submit" class="btn">Submit Question</button>

      <p id="formMessage"></p>
    </form>

  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<!-- FIREBASE + LOGIC -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  collection, 
  addDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const userArea = document.getElementById("userArea");

// NAVBAR AUTH
userArea.style.display = "none";

onAuthStateChanged(auth, async (user) => {

  if (user) {
    let name = "User";

    try {
      const docSnap = await getDoc(doc(db, "users", user.uid));
      if (docSnap.exists()) {
        name = docSnap.data().name || "User";
      }
    } catch (error) {}

    userArea.innerHTML = `
      <span style="color:white;">👤 ${name}</span>
      <button onclick="logout()" class="btn">Logout</button>
    `;

  } else {
    userArea.innerHTML = `
      <a href="login.html" class="btn">Login</a>
      <a href="signup.html" class="btn btn-outline">Signup</a>
    `;
  }

  userArea.style.display = "flex";
});

// LOGOUT
window.logout = async function() {
  await signOut(auth);
  location.reload();
};

// SUBMIT FORM
document.getElementById("questionForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const submitBtn = e.target.querySelector("button");
  submitBtn.disabled = true;
  submitBtn.innerText = "Submitting...";

  const botField = document.getElementById("website").value;
  if (botField) return; // bot detected

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const category = document.getElementById("category").value;
  let question = document.getElementById("question").value;
  const msg = document.getElementById("formMessage");

  // XSS protection
  question = question.replace(/<[^>]*>?/gm, "");

  if (!category || !question) {
    msg.innerText = "Fill required fields ❌";
    msg.style.color = "red";
    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Question";
    return;
  }

  try {
    await addDoc(collection(db, "questions"), {
      name,
      email,
      category,
      question,
      createdAt: new Date()
    });

    msg.innerText = "Question submitted ✅";
    msg.style.color = "green";

    e.target.reset();

    setTimeout(() => {
      msg.innerText = "";
    }, 5000);

  } catch (error) {
    msg.innerText = "Error submitting ❌";
    msg.style.color = "red";
  }

  submitBtn.disabled = false;
  submitBtn.innerText = "Submit Question";
});

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
