<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentors | Connect</title>

<link rel="stylesheet" href="style.css">

<style>
.mentor-container {
  max-width: 1100px;
  margin: 40px auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
  gap: 20px;
}

.mentor-card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.mentor-card:hover {
  transform: translateY(-5px);
}

.mentor-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.mentor-info {
  padding: 15px;
}

.badge {
  background: #16a34a;
  color: white;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 8px;
}

.page-section {
  margin-top: 40px;
}

.empty-state {
  text-align: center;
  color: gray;
  margin-top: 30px;
}
</style>

</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
  </div>
</nav>

<!-- 🔥 BROWSE MENTORS -->
<section class="page-section">
  <div class="container">
    <h2>Browse Mentors</h2>
    <div class="mentor-container" id="mentorList"></div>
    <p id="emptyState" class="empty-state"></p>
  </div>
</section>

<!-- 👇 APPLY -->
<section class="page-section">
  <div class="container">
    <h2>Become a Mentor</h2>

    <form id="mentorForm" class="question-form">
      <input type="text" id="mentorName" placeholder="Your Name" required>
      <input type="email" id="mentorEmail" placeholder="Email" required>
      <input type="number" id="mentorExperience" placeholder="Years of Experience" required>

      <select id="mentorLevel" required>
        <option value="">Select Level</option>
        <option>College Student</option>
        <option>Graduate</option>
      </select>

      <textarea id="mentorReason" placeholder="Why mentor?" required></textarea>

      <button type="submit" class="btn">Apply</button>
      <p id="mentorMessage"></p>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ✅ REAL CONFIG (DON'T SHORTEN API KEY) */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

/* =========================
   ✅ AUTH FIX (IMPORTANT)
========================= */
let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

/* =========================
   APPLY FORM
========================= */
const form = document.getElementById("mentorForm");
const msg = document.getElementById("mentorMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("mentorName").value.trim();
  const email = document.getElementById("mentorEmail").value.trim();
  const experience = document.getElementById("mentorExperience").value;

  const btn = form.querySelector("button");

  btn.disabled = true;
  btn.innerText = "Submitting...";

  // ❌ VALIDATION
  if (!email.includes("@") || !email.includes(".")) {
    msg.innerText = "Invalid email ❌";
    msg.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Apply";
    return;
  }

  // 🔥 AUTH FIX HERE
  if (!currentUser) {
    msg.innerText = "Please login first ❌";
    msg.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Apply";
    return;
  }

  try {
    await updateDoc(doc(db, "users", currentUser.uid), {
      name,
      email,
      role: "mentor",
      experience: Number(experience),
      verified: false
    });

  } catch (error) {
    await setDoc(doc(db, "users", currentUser.uid), {
      name,
      email,
      role: "mentor",
      experience: Number(experience),
      verified: false,
      createdAt: new Date()
    });
  }

  msg.innerText = "Application submitted ✅ Wait for approval";
  msg.style.color = "green";

  form.reset();

  setTimeout(() => msg.innerText = "", 4000);

  btn.disabled = false;
  btn.innerText = "Apply";
});

/* =========================
   LOAD MENTORS
========================= */
const container = document.getElementById("mentorList");
const emptyState = document.getElementById("emptyState");

onSnapshot(collection(db, "users"), (snap) => {

  container.innerHTML = "";
  let count = 0;

  snap.forEach(docSnap => {
    const data = docSnap.data();

    if (
      data.role === "mentor" &&
      data.verified === true &&
      typeof data.name === "string"
    ) {

      count++;

      const safeName = (data.name || "User")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      container.innerHTML += `
        <div class="mentor-card">
          <img src="https://ui-avatars.com/api/?name=${safeName}">
          
          <div class="mentor-info">

            <div class="badge">Verified Mentor</div>

            <h3>${safeName}</h3>
            <p>${data.experience || 0} years experience</p>

            <button onclick="viewProfile('${docSnap.id}')">
              View Profile
            </button>

            <p style="font-size:10px; color:gray;">
              Verification confirms identity only. Advice responsibility is individual.
            </p>

          </div>
        </div>
      `;
    }
  });

  if (count === 0) {
    emptyState.innerText = "No verified mentors yet. Be the first to apply 🚀";
  } else {
    emptyState.innerText = "";
  }

});

/* =========================
   PROFILE REDIRECT
========================= */
window.viewProfile = function(id) {
  window.location.href = "mentor-profile.html?id=" + id;
};

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
