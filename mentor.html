<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mentors | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 PAGE LAYOUT
========================= */

.mentor-header {
  text-align: center;
  margin: 50px 0 20px;
}

.mentor-header p {
  color: #64748b;
}

/* GRID */
.mentor-container {
  max-width: 1100px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap: 25px;
}

/* CARD */
.mentor-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  transition: 0.25s;
}

.mentor-card:hover {
  transform: translateY(-6px);
}

.mentor-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.mentor-info {
  padding: 20px;
}

.badge {
  background: #16a34a;
  color: white;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 10px;
}

.mentor-info h3 {
  margin-bottom: 5px;
}

.mentor-meta {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 12px;
}

.mentor-card button {
  width: 100%;
  padding: 10px;
  border-radius: 30px;
  border: none;
  background: #4f46e5;
  color: white;
  cursor: pointer;
}

/* EMPTY */
.empty-state {
  text-align: center;
  color: #64748b;
  margin-top: 30px;
}

/* =========================
   🧠 FORM SECTION
========================= */

.apply-section {
  background: #f8fafc;
  margin-top: 60px;
  padding: 60px 0;
}

.apply-box {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.apply-box h2 {
  text-align: center;
  margin-bottom: 10px;
}

.apply-box p {
  text-align: center;
  color: #64748b;
  margin-bottom: 20px;
}

.apply-box input,
.apply-box select,
.apply-box textarea {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}

.apply-box button {
  margin-top: 15px;
  width: 100%;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="container nav-flex">
    <div class="logo">
      <a href="index.html">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="mentor.html">Mentors</a>
    </div>
  </div>
</nav>

<!-- =========================
     👨‍🎓 MENTORS
========================= -->

<section>
  <div class="container">

    <div class="mentor-header">
      <h2>Browse Verified Mentors</h2>
      <p>Get guidance from students who’ve already been in your position</p>
    </div>

    <div class="mentor-container" id="mentorList"></div>
    <p id="emptyState" class="empty-state"></p>

  </div>
</section>

<!-- =========================
     🚀 APPLY
========================= -->

<section class="apply-section">
  <div class="container">

    <div class="apply-box">
      <h2>Become a Mentor</h2>
      <p>Help juniors with your real experience</p>

      <form id="mentorForm">

        <input type="text" id="mentorName" placeholder="Your Name" required>

        <input type="email" id="mentorEmail" placeholder="Email" required>

        <input type="number" id="mentorExperience" placeholder="Years of Experience" required>

        <select id="mentorLevel" required>
          <option value="">Select Level</option>
          <option>College Student</option>
          <option>Graduate</option>
        </select>

        <textarea id="mentorReason" placeholder="Why do you want to mentor?" required></textarea>

        <button type="submit" class="btn">Submit Application</button>

        <p id="mentorMessage"></p>

      </form>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<!-- FIREBASE (UNCHANGED LOGIC) -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* APPLY */
const form = document.getElementById("mentorForm");
const msg = document.getElementById("mentorMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = mentorName.value;
  const email = mentorEmail.value;
  const level = mentorLevel.value;
  const reason = mentorReason.value;
  const experience = mentorExperience.value;

  try {
    await addDoc(collection(db, "mentorApplications"), {
      name,
      email,
      level,
      reason,
      experience,
      createdAt: new Date()
    });

    msg.innerText = "Application submitted ✅";
    msg.style.color = "green";
    form.reset();

  } catch (error) {
    msg.innerText = "Error ❌";
    msg.style.color = "red";
  }
});

/* LOAD MENTORS */
const container = document.getElementById("mentorList");
const emptyState = document.getElementById("emptyState");

onSnapshot(collection(db, "users"), (snap) => {

  container.innerHTML = "";
  let count = 0;

  snap.forEach(doc => {
    const data = doc.data();

    if (data.role === "mentor" && data.verified === true) {

      count++;

      container.innerHTML += `
        <div class="mentor-card">
          <img src="https://ui-avatars.com/api/?name=${data.name}">
          
          <div class="mentor-info">

            <div class="badge">Verified</div>

            <h3>${data.name || "User"}</h3>

            <div class="mentor-meta">
              ${data.experience || 0}+ years experience
            </div>

            <button onclick="viewProfile('${doc.id}')">
              View Profile
            </button>

          </div>
        </div>
      `;
    }
  });

  emptyState.innerText = count === 0 
    ? "No mentors yet. Be the first to apply 🚀" 
    : "";

});

/* PROFILE */
window.viewProfile = function(id) {
  window.location.href = "mentor-profile.html?id=" + id;
};

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
