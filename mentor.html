<!-- CONTENT -->
<section class="page-section">
  <div class="container">
    <h2>Become a Mentor</h2>
    <p class="center-text">
      Share your experience and guide juniors.
    </p>
  </div>
</section>

<section class="page-section">
  <div class="container">
    <h2>Apply to Become a Mentor</h2>

    <form class="question-form" id="mentorForm">

      <input type="text" id="mentorName" placeholder="Your Name" required>
      <input type="email" id="mentorEmail" placeholder="Email" required>

      <select id="mentorLevel" required>
        <option value="">Select Level</option>
        <option>College Student</option>
        <option>Graduate</option>
      </select>

      <select id="mentorExpertise" required>
        <option value="">Select Expertise</option>
        <option>Exams</option>
        <option>Career</option>
      </select>

      <textarea id="mentorReason" placeholder="Why mentor?" required></textarea>

      <button type="submit" class="btn">Apply</button>

      <p id="mentorMessage"></p>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>

<!-- 🔥 FIREBASE + SUBMIT LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ✅ YOUR CONFIG (same as questions page)
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🚀 SUBMIT FORM
const form = document.getElementById("mentorForm");
const msg = document.getElementById("mentorMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("mentorName").value.trim();
  const email = document.getElementById("mentorEmail").value.trim();
  const level = document.getElementById("mentorLevel").value;
  const expertise = document.getElementById("mentorExpertise").value;
  const reason = document.getElementById("mentorReason").value.trim();

  if (!name || !email || !level || !expertise || !reason) {
    msg.innerText = "Please fill all fields";
    return;
  }

  try {
    await addDoc(collection(db, "mentorApplications"), {
      name,
      email,
      level,
      expertise,
      reason,
      createdAt: new Date().toLocaleString()
    });

    msg.innerText = "✅ Application submitted successfully!";
    form.reset();

  } catch (error) {
    msg.innerText = "❌ Error: " + error.message;
  }
});
</script>
