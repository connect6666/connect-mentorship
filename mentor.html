<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentors | Connect</title>

<link rel="stylesheet" href="style.css">

<style>
.mentor-container {
  max-width: 1100px;
  margin: 40px auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
  gap: 20px;
}

.mentor-card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.mentor-card:hover {
  transform: translateY(-5px);
}

.mentor-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.mentor-info {
  padding: 15px;
}

.badge {
  background: #16a34a;
  color: white;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 8px;
}

.page-section {
  margin-top: 40px;
}

.empty-state {
  text-align: center;
  color: gray;
  margin-top: 30px;
}
</style>

</head>

<body>

<nav>
  <div class="container">
    <div class="logo">Connect</div>
  </div>
</nav>

<!-- 🔥 BROWSE MENTORS -->
<section class="page-section">
  <div class="container">
    <h2>Browse Mentors</h2>
    <div class="mentor-container" id="mentorList"></div>
    <p id="emptyState" class="empty-state"></p>
  </div>
</section>

<!-- 👇 APPLY -->
<section class="page-section">
  <div class="container">
    <h2>Become a Mentor</h2>

    <form id="mentorForm" class="question-form">
      <input type="text" id="mentorName" placeholder="Your Name" required>
      <input type="email" id="mentorEmail" placeholder="Email" required>
      <input type="number" id="mentorExperience" placeholder="Years of Experience" required>

      <select id="mentorLevel" required>
        <option value="">Select Level</option>
        <option>College Student</option>
        <option>Graduate</option>
      </select>

      <p style="text-align:center; font-size:12px; color:gray;">
Mentors are independent individuals. Connect does not guarantee results or outcomes.
</p>

      <textarea id="mentorReason" placeholder="Why mentor?" required></textarea>

      <label style="font-size:12px;">
  <input type="checkbox" id="agree" required>
  I agree to help students honestly and follow mentor guidelines.
</label>

      <button type="submit" class="btn">Apply</button>
      <p id="mentorMessage"></p>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  setDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔐 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* =========================
   AUTH
========================= */
let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

/* =========================
   APPLY FORM (FIXED)
========================= */
const form = document.getElementById("mentorForm");
const msg = document.getElementById("mentorMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("mentorName").value.trim();
  const email = document.getElementById("mentorEmail").value.trim();
  const experience = document.getElementById("mentorExperience").value;
  const agree = document.getElementById("agree").checked;

if (!agree) {
  msg.innerText = "Please accept guidelines ❌";
  msg.style.color = "red";
  btn.disabled = false;
  btn.innerText = "Apply";
  return;
}
  const reason = document.getElementById("mentorReason").value.trim();

  const btn = form.querySelector("button");

  btn.disabled = true;
  btn.innerText = "Submitting...";

  // ✅ VALIDATION
  if (!name || name.length < 2) {
    return error("Enter valid name");
  }

  if (!email.includes("@") || !email.includes(".")) {
    return error("Invalid email");
  }

  if (experience < 0 || experience > 50) {
    return error("Experience must be between 0–50");
  }

  if (!currentUser) {
    return error("Please login first");
  }

  try {
    /* ✅ MERGE TRUE FIX (IMPORTANT) */
    await setDoc(doc(db, "users", currentUser.uid), {
      name,
      email,
      role: "mentor",
      experience: Number(experience),
      reason,
      verified: false,
      updatedAt: new Date()
    }, { merge: true });

    msg.innerText = "Application submitted ✅ Wait for approval";
    msg.style.color = "green";

    form.reset();

    setTimeout(() => msg.innerText = "", 4000);

  } catch (err) {
    console.error(err);
    error("Something went wrong");
  }

  resetBtn();

  function error(text) {
    msg.innerText = "❌ " + text;
    msg.style.color = "red";
    resetBtn();
  }

  function resetBtn() {
    btn.disabled = false;
    btn.innerText = "Apply";
  }

});

/* =========================
   LOAD MENTORS (SECURE QUERY)
========================= */
const container = document.getElementById("mentorList");
const emptyState = document.getElementById("emptyState");

/* 🔥 IMPORTANT FIX */
const mentorQuery = query(
  collection(db, "users"),
  where("role", "==", "mentor"),
  where("verified", "==", true)
);

/* 🔄 REAL-TIME */
onSnapshot(mentorQuery, (snap) => {

  container.innerHTML = "";

  if (snap.empty) {
    emptyState.innerText = "No verified mentors yet. Be the first to apply 🚀";
    return;
  }

  snap.forEach(docSnap => {
    const data = docSnap.data();

    const safeName = (data.name || "User")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    container.innerHTML += `
      <div class="mentor-card">
        <img src="https://ui-avatars.com/api/?name=${safeName}">
        
        <div class="mentor-info">

          <div class="badge">Verified Mentor</div>

          <h3>${safeName}</h3>
          <p>${data.experience || 0} years experience</p>

          <button onclick="viewProfile('${docSnap.id}')">
            View Profile
          </button>

          <p style="font-size:10px; color:gray;">
            Verification confirms identity only.
          </p>

        </div>
      </div>
    `;
  });

  emptyState.innerText = "";

}, (err) => {
  console.error(err);
  emptyState.innerText = "Error loading mentors ❌";
});

/* =========================
   PROFILE REDIRECT
========================= */
window.viewProfile = function(id) {
  window.location.href = "mentor-profile.html?id=" + id;
};

</script>

<script type="module" src="auth.js"></script>

</body>
</html>
