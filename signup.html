<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup | Connect Mentorship</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 SIGNUP
========================= */

.signup-wrapper {
  max-width: 400px;
  margin: 100px auto;
  padding: 0 20px;
}

.signup-card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
}

.signup-card input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}

.google-btn {
  background: white;
  border: 1px solid #e2e8f0;
  color: #333;
}

.helper-text {
  font-size: 13px;
  color: #64748b;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="signup-wrapper">

  <div class="signup-card">

    <h2>Create Your Account 🚀</h2>
    <p style="color:#64748b;">Start your mentorship journey</p>

    <input type="text" id="name" placeholder="Your Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password (min 6 characters)">
    <input type="text" id="phone" placeholder="WhatsApp Number (e.g. 919876543210)">

    <p class="helper-text">
      You can apply as a mentor later from your profile.
    </p>

    <button onclick="signup()" class="btn" id="signupBtn">
      Create Account
    </button>

    <button id="googleLogin" class="btn google-btn">
      🔵 Continue with Google
    </button>

    <p style="margin-top:15px;">
      Already have account? <a href="login.html">Login</a>
    </p>

    <p id="msg"></p>

  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getAuth, 
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, 
  setDoc, 
  doc,
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById("msg");

/* =========================
   🔐 EMAIL SIGNUP
========================= */

window.signup = async function() {

  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const pass = passwordInput.value;
  const phone = phoneInput.value.trim();

  const btn = document.getElementById("signupBtn");
  btn.innerText = "Creating...";

  if (!name || !email || !pass || !phone) {
    msg.innerText = "All fields required ❌";
    msg.style.color = "red";
    btn.innerText = "Create Account";
    return;
  }

  if (!/^\d{10,15}$/.test(phone)) {
    msg.innerText = "Enter valid phone number ❌";
    msg.style.color = "red";
    btn.innerText = "Create Account";
    return;
  }

  if (pass.length < 6) {
    msg.innerText = "Password must be 6+ characters ❌";
    msg.style.color = "red";
    btn.innerText = "Create Account";
    return;
  }

  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, pass);

    // ✅ ALWAYS USER
    await setDoc(doc(db, "users", userCred.user.uid), {
      name,
      role: "user",
      phone,
      verified: false,
      createdAt: new Date()
    });

    window.location.href = "index.html";

  } catch (error) {
    msg.innerText = error.message;
    msg.style.color = "red";
  }

  btn.innerText = "Create Account";
};


/* =========================
   🔵 GOOGLE SIGNUP
========================= */

document.getElementById("googleLogin").addEventListener("click", async () => {

  const provider = new GoogleAuthProvider();

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      await setDoc(userRef, {
        name: user.displayName || "User",
        role: "user",
        verified: false,
        createdAt: new Date()
      });
    }

    window.location.href = "index.html";

  } catch (error) {
    msg.innerText = "Google login failed ❌";
    msg.style.color = "red";
  }

});

</script>

</body>
</html>
