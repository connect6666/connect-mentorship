<!DOCTYPE html>
<html>
<head>
  <title>Signup | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Create Account</h2>

  <input type="text" id="name" placeholder="Your Name"><br><br>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password (min 6 characters)"><br><br>

  <!-- ROLE SELECT -->
  <select id="role">
    <option value="user">Student</option>
    <option value="mentor">Mentor</option>
  </select><br><br>

  <button onclick="signup()" class="btn">Signup</button>

  <p>Already have account? <a href="login.html">Login</a></p>

  <p id="msg" style="margin-top:10px;"></p>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.signup = async function() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;
  const role = document.getElementById("role").value;
  const msg = document.getElementById("msg");

  // 🔴 VALIDATION
  if (!name || !email || !pass) {
    msg.style.color = "red";
    msg.innerText = "All fields are required ❌";
    return;
  }

  if (pass.length < 6) {
    msg.style.color = "red";
    msg.innerText = "Password must be at least 6 characters ❌";
    return;
  }

  try {
    msg.style.color = "black";
    msg.innerText = "Creating account...";

    const userCred = await createUserWithEmailAndPassword(auth, email, pass);

    // 🔥 SAVE USER DATA
    await setDoc(doc(db, "users", userCred.user.uid), {
      name: name,
      role: role,
      createdAt: new Date()
    });

    msg.style.color = "green";
    msg.innerText = "Account created successfully ✅";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1000);

  } catch (error) {
    msg.style.color = "red";

    if (error.code === "auth/email-already-in-use") {
      msg.innerText = "Email already registered ❌";
    } else if (error.code === "auth/invalid-email") {
      msg.innerText = "Invalid email format ❌";
    } else {
      msg.innerText = error.message;
    }
  }
};
</script>

</body>
</html>
