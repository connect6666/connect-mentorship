<!DOCTYPE html>
<html>
<head>
  <title>Select Role | Connect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Select Your Role</h2>
  <p>Choose how you want to use Connect.</p>

  <button id="studentBtn" class="btn">👨‍🎓 Student</button><br><br>
  <button id="mentorBtn" class="btn">🧑‍🏫 Mentor</button>

  <p id="msg"></p>
</div>

<script type="module">
import { auth, db } from "./auth.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const msg = document.getElementById("msg");
let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
});

async function setRole(role) {
  if (!currentUser) {
    msg.style.color = "red";
    msg.innerText = "Please login again ❌";
    return;
  }

  try {
    await updateDoc(doc(db, "users", currentUser.uid), {
      role: role,
      verified: role === "mentor" ? false : false
    });

    window.location.href = "index.html";

  } catch (error) {
    console.error(error);
    msg.style.color = "red";
    msg.innerText = "Role update failed ❌";
  }
}

document.getElementById("studentBtn").addEventListener("click", () => setRole("user"));
document.getElementById("mentorBtn").addEventListener("click", () => setRole("mentor"));
</script>

</body>
</html>
