<!DOCTYPE html>
<html>
<head>
  <title>Select Role</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:100px auto;text-align:center;">
  <h2>Select Your Role</h2>

  <button onclick="setRole('user')" class="btn">👨‍🎓 Student</button><br><br>
  <button onclick="setRole('mentor')" class="btn">🧑‍🏫 Mentor</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.setRole = async function(role) {

  const user = auth.currentUser;

  if (!user) {
    alert("Login again");
    return;
  }

  await updateDoc(doc(db, "users", user.uid), {
    role: role
  });

  window.location.href = "index.html";
};

</script>

</body>
</html>
