<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  background: #0b1020;
}

.dm-wrapper {
  max-width: 1150px;
  height: calc(100vh - 90px);
  margin: 25px auto;
  background: #ffffff;
  border-radius: 18px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 360px 1fr;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.dm-left {
  border-right: 1px solid #e5e7eb;
  background: #fff;
  overflow-y: auto;
}

.dm-left-header {
  padding: 22px;
  border-bottom: 1px solid #e5e7eb;
}

.dm-left-header h2 {
  text-align: left;
  font-size: 24px;
  margin: 0;
}

.search-box {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 999px;
  padding: 12px 16px;
  color: #6b7280;
}

.chat-user {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 18px;
  cursor: pointer;
  transition: 0.2s;
  border-bottom: 1px solid #f1f5f9;
}

.chat-user:hover {
  background: #f8fafc;
}

.chat-user img {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  object-fit: cover;
}

.chat-user-info {
  flex: 1;
  min-width: 0;
}

.chat-user-info h3 {
  margin: 0;
  font-size: 15px;
  color: #111827;
}

.chat-user-info p {
  margin: 4px 0 0;
  font-size: 13px;
  color: #6b7280;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dm-right {
  background: linear-gradient(135deg, #eef2ff, #ffffff);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}

.empty-chat img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin-bottom: 18px;
}

.empty-chat h2 {
  margin-bottom: 10px;
}

.empty-chat p {
  color: #6b7280;
  max-width: 380px;
}

.open-btn {
  display: inline-block;
  margin-top: 18px;
  padding: 13px 28px;
  border-radius: 999px;
  background: #4f46e5;
  color: white;
  text-decoration: none;
  font-weight: 700;
}

@media (max-width: 768px) {
  .dm-wrapper {
    height: auto;
    margin: 0;
    border-radius: 0;
    grid-template-columns: 1fr;
  }

  .dm-right {
    display: none;
  }
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/" style="color:white;text-decoration:none;">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Mentors</a>
      <a href="/connect-mentorship/profile.html">Profile</a>
      <a href="/connect-mentorship/my-chats.html">My Chats</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="dm-wrapper">

  <div class="dm-left">
    <div class="dm-left-header">
      <h2>Messages</h2>
     <input 
  type="text" 
  id="searchInput" 
  class="search-box" 
  placeholder="🔍 Search messages"
>
    </div>

    <div id="chatList">Loading chats...</div>
  </div>

  <div class="dm-right" id="chatPreview">
    <div class="empty-chat">
      <div style="font-size:70px;">💬</div>
      <h2>Your messages</h2>
      <p>Select a chat from the left side to continue your private mentorship conversation.</p>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
where,
limit,
onSnapshot,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const chatList = document.getElementById("chatList");
const chatPreview = document.getElementById("chatPreview");
  const searchInput = document.getElementById("searchInput");
let allChats = [];

function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}
  function getLastSeenTime(lastSeen) {
  if (!lastSeen) return 0;
  if (lastSeen.toDate) return lastSeen.toDate().getTime();
  return new Date(lastSeen).getTime();
}

async function getUser(uid) {
  const snap = await getDoc(doc(db, "users", uid));

  if (snap.exists()) {
    const data = snap.data();

   return {
  id: uid,
  name: data.name || data.email || "User",
  photoURL: data.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name || "User")}&background=6366f1&color=fff`,
  role: data.role || "user",
lastSeen: data.lastSeen || null,
isOnline: data.isOnline === true && (Date.now() - getLastSeenTime(data.lastSeen) < 70000)
};
  }

return {
  id: uid,
  name: "User",
  photoURL: "https://ui-avatars.com/api/?name=User&background=6366f1&color=fff",
  role: "user",
  isOnline: false,
  lastSeen: null
};
}

function openPreview(chatId, otherUser, lastMessage, mentorId, currentPreviewSessionId) {
  chatPreview.innerHTML = `
    <div class="empty-chat">
      <img src="${otherUser.photoURL}" alt="${escapeHTML(otherUser.name)}">
      <h2>${escapeHTML(otherUser.name)}</h2>
      <p>${escapeHTML(lastMessage || "No message yet")}</p>

      <a class="open-btn" href="/connect-mentorship/chat.html?chatId=${encodeURIComponent(chatId)}&mentorId=${encodeURIComponent(mentorId)}&sessionId=${encodeURIComponent(currentPreviewSessionId)}">
        Open Chat
      </a>
    </div>
  `;
}

  function renderChats(chats) {
  chatList.innerHTML = "";

  if (chats.length === 0) {
    chatList.innerHTML = `<p style="padding:20px;color:gray;">No chats found.</p>`;
    return;
  }

  chats.forEach(({ chatId, chat, otherUser }) => {
    const item = document.createElement("div");
    item.className = "chat-user";

    item.innerHTML = `
  <img src="${otherUser.photoURL}" alt="${escapeHTML(otherUser.name)}">

  <div class="chat-user-info">
    <h3>${escapeHTML(otherUser.name)}</h3>

   <p>${escapeHTML(chat.lastMessage || (chat.status === "expired" ? "Session expired" : "Paid session chat"))}</p>

    <small style="color:${otherUser.isOnline ? '#22c55e' : '#9ca3af'};">
      ${otherUser.isOnline ? '● Online' : '● Offline'}
    </small>
  </div>

  ${chat.unread && chat.unread[auth.currentUser.uid] > 0 ? `
    <span class="unread-badge">
      ${chat.unread[auth.currentUser.uid]}
    </span>
  ` : ""}
`;

    item.onclick = () => {
      if (window.innerWidth <= 768) {
window.location.href = `/connect-mentorship/chat.html?chatId=${encodeURIComponent(chatId)}&mentorId=${encodeURIComponent(chat.mentorId || otherUser.id)}&sessionId=${encodeURIComponent(chat.sessionId)}`;
      } else {
       openPreview(chatId, otherUser, chat.lastMessage, chat.mentorId || otherUser.id, chat.sessionId);
      }
    };

    chatList.appendChild(item);
  });
}

searchInput.addEventListener("input", () => {
  const keyword = searchInput.value.toLowerCase().trim();

  const filtered = allChats.filter(item =>
    item.otherUser.name.toLowerCase().includes(keyword) ||
    String(item.chat.lastMessage || "").toLowerCase().includes(keyword)
  );

  renderChats(filtered);
});

onAuthStateChanged(auth, (user) => {
  // 🔥 ADD THIS
setInterval(async () => {
  if (auth.currentUser) {
    await setDoc(doc(db, "users", auth.currentUser.uid), {
      isOnline: true,
      lastSeen: new Date()
    }, { merge: true });
  }
}, 30000);
  
  if (!user) {
    alert("Please login first ❌");
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

 const q = query(
  collection(db, "chats"),
  where("participants", "array-contains", user.uid),
  limit(20)
);
onSnapshot(q, { includeMetadataChanges: true }, async (snap) => {
   allChats = [];

if (snap.empty) {
  chatList.innerHTML = `
    <p style="padding:20px;color:gray;">No chats yet.</p>
  `;
  return;
}

for (const docSnap of snap.docs) {
  const chat = docSnap.data();
  const chatId = docSnap.id;

  if (!chat.participants || !Array.isArray(chat.participants)) continue;

if (
  !chat.sessionId ||
  chat.paymentStatus !== "paid" ||
  chat.chatStatus !== "unlocked" ||
  !["active", "expired"].includes(chat.status)
) {
  continue;
}

const otherUserId = chat.participants.find(id => id !== user.uid);
  const otherUser = await getUser(otherUserId);

  allChats.push({
    chatId,
    chat,
    otherUser
  });
}

renderChats(allChats);

  }, (error) => {
    console.error(error);
    chatList.innerHTML = "<p style='padding:20px;color:red;'>Error loading chats ❌</p>";
  });
});
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
