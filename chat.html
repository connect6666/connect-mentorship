<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
.chat-page {
  max-width: 850px;
  margin: 30px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  overflow: hidden;
}

.chat-header {
  background: #4f46e5;
  color: white;
  padding: 18px;
}

.chat-header h2 {
  margin: 0;
  font-size: 22px;
}

.chat-header p {
  margin-top: 5px;
  font-size: 13px;
  color: #e0e7ff;
}

.warning {
  background: #fff7ed;
  color: #9a3412;
  padding: 10px 15px;
  font-size: 13px;
  text-align: center;
}

.chat-box {
  height: 450px;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
}

.message {
  max-width: 75%;
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 14px;
  font-size: 14px;
}

.mine {
  background: #4f46e5;
  color: white;
  margin-left: auto;
}

.other {
  background: white;
  color: #111827;
  border: 1px solid #e5e7eb;
  margin-right: auto;
}

.chat-input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

.chat-input-area input {
  flex: 1;
  padding: 13px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

#chatMsg {
  text-align: center;
  font-size: 13px;
  margin: 8px;
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/" style="color:white;text-decoration:none;">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Mentors</a>
      <a href="/connect-mentorship/profile.html">Profile</a>
      <a href="/connect-mentorship/my-chats.html">My Chats</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="chat-page">
  <div class="chat-header">
    <h2>💬 Private Connect Chat</h2>
    <p id="chatTitle">Loading chat...</p>
  </div>

  <div class="warning">
    For privacy, phone numbers, emails, links, WhatsApp, Instagram, Telegram, UPI and direct contact details are blocked.
  </div>

  <div class="chat-box" id="chatBox">Loading messages...</div>

  <p id="chatMsg"></p>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
    <button class="btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
let chatId = params.get("chatId");
let mentorId = params.get("mentorId");

const chatBox = document.getElementById("chatBox");
const chatMsg = document.getElementById("chatMsg");
const chatTitle = document.getElementById("chatTitle");
const messageInput = document.getElementById("messageInput");

let currentUser = null;
let otherUserId = null;
let unsubscribeMessages = null;

function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function containsPrivateInfo(text) {
  const patterns = [
    /\b\d{10,15}\b/,
    /[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}/,
    /(https?:\/\/|www\.)/i,
    /\bwhatsapp\b|\bwa\.me\b/i,
    /\binstagram\b|\binsta\b|\big\b/i,
    /\btelegram\b|\bt\.me\b/i,
    /\bfacebook\b|\bfb\.com\b/i,
    /\bsnapchat\b/i,
    /\bupi\b|\bpaytm\b|\bgpay\b|\bphonepe\b/i,
    /@[a-zA-Z0-9_.]{3,}/
  ];

  return patterns.some(pattern => pattern.test(text.toLowerCase()));
}

async function getUserName(uid) {
  const snap = await getDoc(doc(db, "users", uid));
  if (snap.exists()) {
    return snap.data().name || snap.data().email || "User";
  }
  return "User";
}

async function createOrLoadChat(user) {

  // CASE 1: Opening existing chat from My Chats
  if (chatId) {
    const chatRef = doc(db, "chats", chatId);
    const chatSnap = await getDoc(chatRef);

    if (!chatSnap.exists()) {
      chatBox.innerHTML = "Chat not found ❌";
      return;
    }

    const chatData = chatSnap.data();

    if (!chatData.participants || !chatData.participants.includes(user.uid)) {
      chatBox.innerHTML = "You are not allowed to open this chat ❌";
      return;
    }

    otherUserId = chatData.participants.find(uid => uid !== user.uid);

    const otherName = await getUserName(otherUserId);
    chatTitle.innerText = "Chat with " + otherName;

    loadMessages();
    return;
  }

  // CASE 2: Starting new chat from mentor-profile.html
  if (!mentorId) {
    chatBox.innerHTML = "Invalid chat link ❌";
    return;
  }

  if (user.uid === mentorId) {
    chatBox.innerHTML = "You cannot chat with yourself ❌";
    return;
  }

  chatId = [user.uid, mentorId].sort().join("_");
  otherUserId = mentorId;

  await setDoc(doc(db, "chats", chatId), {
    studentId: user.uid,
    mentorId: mentorId,
    participants: [user.uid, mentorId],
    status: "active",
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  }, { merge: true });

  const mentorName = await getUserName(mentorId);
  chatTitle.innerText = "Chat with " + mentorName;

  loadMessages();
}

function loadMessages() {
  if (unsubscribeMessages) unsubscribeMessages();

  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(q, (snap) => {
    chatBox.innerHTML = "";

    if (snap.empty) {
      chatBox.innerHTML = "<p style='text-align:center;color:gray;'>No messages yet.</p>";
      return;
    }

    snap.forEach((docSnap) => {
      const msg = docSnap.data();

      const div = document.createElement("div");
      div.className = "message " + (msg.senderId === currentUser.uid ? "mine" : "other");
      div.innerHTML = escapeHTML(msg.text);

      chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

window.sendMessage = async function() {
  const text = messageInput.value.trim();

  chatMsg.innerText = "";
  chatMsg.style.color = "red";

  if (!text) return;

  if (!currentUser) {
    chatMsg.innerText = "Please login first ❌";
    return;
  }

  if (!chatId) {
    chatMsg.innerText = "Chat not ready ❌";
    return;
  }

  if (containsPrivateInfo(text)) {
    chatMsg.innerText = "Private contact details are not allowed ❌";
    return;
  }

  try {
    await addDoc(collection(db, "chats", chatId, "messages"), {
      text,
      senderId: currentUser.uid,
      createdAt: serverTimestamp(),
      expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)
    });

    await setDoc(doc(db, "chats", chatId), {
      updatedAt: serverTimestamp(),
      lastMessage: text
    }, { merge: true });

    messageInput.value = "";

  } catch (error) {
    console.error(error);
    chatMsg.innerText = "Message failed ❌ Check Firestore rules.";
  }
};

messageInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    sendMessage();
  }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login to open chat ❌");
    window.location.href = "/connect-mentorship/login.html";
    return;
  }

  currentUser = user;
  await createOrLoadChat(user);
});
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
