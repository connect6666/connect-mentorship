<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
.chat-page {
  max-width: 850px;
  margin: 30px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  overflow: hidden;
}

.chat-header {
  background: #4f46e5;
  color: white;
  padding: 18px;
}

.chat-header h2 {
  margin: 0;
  font-size: 22px;
}

.chat-header p {
  margin-top: 5px;
  font-size: 13px;
  color: #e0e7ff;
}

.warning {
  background: #fff7ed;
  color: #9a3412;
  padding: 10px 15px;
  font-size: 13px;
  text-align: center;
}

.chat-box {
  height: 450px;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
}

.message {
  max-width: 75%;
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 14px;
  font-size: 14px;
}

.mine {
  background: #4f46e5;
  color: white;
  margin-left: auto;
}

.other {
  background: white;
  color: #111827;
  border: 1px solid #e5e7eb;
  margin-right: auto;
}

.chat-input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

.chat-input-area input {
  flex: 1;
  padding: 13px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

#chatMsg {
  text-align: center;
  font-size: 13px;
  margin: 8px;
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/" style="color:white;text-decoration:none;">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Mentors</a>
      <a href="/connect-mentorship/profile.html">Profile</a>
      <a href="/connect-mentorship/my-chats.html">My Chats</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="chat-page">
  <div class="chat-header">
    <h2>💬 Private Connect Chat</h2>
    <p id="chatTitle">Loading chat...</p>
  </div>

  <div class="warning">
    For privacy, phone numbers, emails, links, WhatsApp, Instagram, Telegram, UPI and direct contact details are blocked.
  </div>

  <div class="chat-box" id="chatBox">Loading messages...</div>
  <p id="typingStatus" style="padding:0 20px;color:#6b7280;font-size:13px;"></p>

  <p id="chatMsg"></p>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
    <button class="btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
let chatId = params.get("chatId");
let mentorId = params.get("mentorId");

const chatBox = document.getElementById("chatBox");
const chatMsg = document.getElementById("chatMsg");
const chatTitle = document.getElementById("chatTitle");
const messageInput = document.getElementById("messageInput");

let currentUser = null;
let otherUserId = null;
let unsubscribeMessages = null;
let typingTimer = null;
let firstMessageLoad = true;

// ===================== UTIL =====================
function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function containsPrivateInfo(text) {
  const patterns = [
    /\b\d{10,15}\b/,
    /[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}/,
    /(https?:\/\/|www\.)/i,
    /\bwhatsapp\b|\bwa\.me\b/i,
    /\binstagram\b|\binsta\b|\big\b/i,
    /\btelegram\b|\bt\.me\b/i,
    /\bupi\b|\bpaytm\b|\bgpay\b|\bphonepe\b/i,
    /@[a-zA-Z0-9_.]{3,}/
  ];
  return patterns.some(p => p.test(text.toLowerCase()));
}

async function getUserName(uid) {
  const snap = await getDoc(doc(db, "users", uid));
  return snap.exists() ? (snap.data().name || snap.data().email) : "User";
}
  // ===================== ONLINE / OFFLINE =====================
let onlineInterval = null;

async function updateOnlineStatus(isOnline) {
  if (!currentUser) return;

  await setDoc(doc(db, "users", currentUser.uid), {
    isOnline: isOnline,
    lastSeen: new Date()
  }, { merge: true });
}

function startOnlineHeartbeat() {
  updateOnlineStatus(true);

  if (onlineInterval) clearInterval(onlineInterval);

  onlineInterval = setInterval(() => {
    updateOnlineStatus(true);
  }, 30000);
}

window.addEventListener("beforeunload", () => {
  if (currentUser) {
    setDoc(doc(db, "users", currentUser.uid), {
      isOnline: false,
      lastSeen: new Date()
    }, { merge: true });
  }
});

// ===================== CHAT INIT =====================
async function createOrLoadChat(user) {

  if (chatId) {
    const chatSnap = await getDoc(doc(db, "chats", chatId));

    if (!chatSnap.exists()) {
      chatBox.innerHTML = "Chat not found ❌";
      return;
    }

    const data = chatSnap.data();
    otherUserId = data.participants.find(id => id !== user.uid);

    chatTitle.innerText = "Chat with " + await getUserName(otherUserId);

    loadMessages();
    listenTyping();
    markChatAsRead();
    requestNotificationPermission();
    return;
  }

  if (!mentorId || user.uid === mentorId) {
    chatBox.innerHTML = "Invalid chat ❌";
    return;
  }

  chatId = [user.uid, mentorId].sort().join("_");
  otherUserId = mentorId;

  await setDoc(doc(db, "chats", chatId), {
    participants: [user.uid, mentorId],
    status: "active",
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  }, { merge: true });

  chatTitle.innerText = "Chat with " + await getUserName(mentorId);

  loadMessages();
  listenTyping();
  markChatAsRead();
  requestNotificationPermission();
}

// ===================== LOAD MESSAGES =====================
function loadMessages() {
  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(q, (snap) => {
    chatBox.innerHTML = "";

    snap.forEach(docSnap => {
      const msg = docSnap.data();

      // 🔔 notification
      if (!firstMessageLoad && msg.senderId !== currentUser.uid) {
        showMessageNotification(msg.text);
      }

      const div = document.createElement("div");
      div.className = "message " + (msg.senderId === currentUser.uid ? "mine" : "other");
      div.innerHTML = escapeHTML(msg.text);

      chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;

    firstMessageLoad = false;
    markChatAsRead();
  });
}

// ===================== SEND =====================
window.sendMessage = async function () {
  const text = messageInput.value.trim();

  if (!text || containsPrivateInfo(text)) return;

  await addDoc(collection(db, "chats", chatId, "messages"), {
    text,
    senderId: currentUser.uid,
    createdAt: serverTimestamp()
  });

  await setDoc(doc(db, "chats", chatId), {
    lastMessage: text,
    updatedAt: serverTimestamp(),
    unread: {
      [otherUserId]: increment(1),
      [currentUser.uid]: 0
    }
  }, { merge: true });

  messageInput.value = "";
  setTypingStatus(false);
};

// ===================== TYPING =====================
function listenTyping() {
  onSnapshot(collection(db, "chats", chatId, "typing"), snap => {
    let typing = false;

    snap.forEach(d => {
      if (d.id !== currentUser.uid && d.data().isTyping) {
        typing = true;
      }
    });

    document.getElementById("typingStatus").innerText = typing ? "Typing..." : "";
  });
}

async function setTypingStatus(val) {
  await setDoc(doc(db, "chats", chatId, "typing", currentUser.uid), {
    isTyping: val
  }, { merge: true });
}

messageInput.addEventListener("input", () => {
  setTypingStatus(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => setTypingStatus(false), 1200);
});

// ===================== STATUS =====================
async function markChatAsRead() {
  await setDoc(doc(db, "chats", chatId), {
    unread: { [currentUser.uid]: 0 }
  }, { merge: true });
}

// ===================== NOTIFICATION =====================
function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function showMessageNotification(text) {
  if (Notification.permission === "granted") {
    new Notification("New message", { body: text });
  }
}

// ===================== INIT =====================
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/connect-mentorship/login.html";

  currentUser = user;

  // ✅ ADD THIS LINE
  startOnlineHeartbeat();

  await createOrLoadChat(user);
});
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
