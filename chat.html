<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat | Connect</title>
<link rel="stylesheet" href="style.css">

<style>
.chat-page {
  max-width: 850px;
  margin: 30px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  overflow: hidden;
}

.chat-header {
  background: #4f46e5;
  color: white;
  padding: 18px;
}

.chat-header h2 {
  margin: 0;
  font-size: 22px;
}

.chat-header p {
  margin-top: 5px;
  font-size: 13px;
  color: #e0e7ff;
}

.warning {
  background: #fff7ed;
  color: #9a3412;
  padding: 10px 15px;
  font-size: 13px;
  text-align: center;
}

.chat-box {
  height: 450px;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
}

.message {
  max-width: 75%;
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 14px;
  font-size: 14px;
}

.mine {
  background: #4f46e5;
  color: white;
  margin-left: auto;
}

.other {
  background: white;
  color: #111827;
  border: 1px solid #e5e7eb;
  margin-right: auto;
}

.chat-input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e5e7eb;
}

.chat-input-area input {
  flex: 1;
  padding: 13px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

#chatMsg {
  text-align: center;
  font-size: 13px;
  margin: 8px;
}
</style>
</head>

<body>

<nav>
  <div class="container">
    <div class="logo">
      <a href="/connect-mentorship/" style="color:white;text-decoration:none;">Connect</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="/connect-mentorship/">Home</a>
      <a href="/connect-mentorship/questions.html">Questions</a>
      <a href="/connect-mentorship/ask.html">Ask Question</a>
      <a href="/connect-mentorship/mentor.html">Mentors</a>
      <a href="/connect-mentorship/profile.html">Profile</a>
      <a href="/connect-mentorship/my-chats.html">My Chats</a>
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<div class="chat-page">
  <div class="chat-header">
    <h2>💬 Private Connect Chat</h2>
    <p id="chatTitle">Loading chat...</p>
  </div>

  <div class="warning">
    For privacy, phone numbers, emails, links, WhatsApp, Instagram, Telegram, UPI and direct contact details are blocked.
  </div>

  <div class="chat-box" id="chatBox">Loading messages...</div>
  <p id="typingStatus" style="padding:0 20px;color:#6b7280;font-size:13px;"></p>

  <p id="chatMsg"></p>

  <button id="startCallBtn" class="btn" style="display:none; margin:10px auto;">
  📞 Start Call
</button>
 <button id="enableNotifyBtn" style="display:none;">🔔 Enable Notifications</button>

  <div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
    <button class="btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
  getMessaging,
  getToken,
  onMessage
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
  const messaging = getMessaging(app);

const params = new URLSearchParams(window.location.search);
let chatId = params.get("chatId");
let mentorId = params.get("mentorId");
let sessionId = params.get("sessionId");
let currentSessionData = null;

const chatBox = document.getElementById("chatBox");
const chatMsg = document.getElementById("chatMsg");
const chatTitle = document.getElementById("chatTitle");
const messageInput = document.getElementById("messageInput");
  const enableNotifyBtn = document.getElementById("enableNotifyBtn");

  const startCallBtn = document.getElementById("startCallBtn");

let currentUser = null;
let otherUserId = null;
let unsubscribeMessages = null;
let typingTimer = null;
let firstMessageLoad = true;
let notificationsEnabled = false;
let currentChatData = null;
let sessionTimer = null;

// ===================== UTIL =====================
function escapeHTML(text) {
  return String(text || "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}

function containsPrivateInfo(text) {
  const patterns = [
    /\b\d{10,15}\b/,
    /[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}/,
    /(https?:\/\/|www\.)/i,
    /\bwhatsapp\b|\bwa\.me\b/i,
    /\binstagram\b|\binsta\b|\big\b/i,
    /\btelegram\b|\bt\.me\b/i,
    /\bupi\b|\bpaytm\b|\bgpay\b|\bphonepe\b/i,
    /@[a-zA-Z0-9_.]{3,}/
  ];
  return patterns.some(p => p.test(text.toLowerCase()));
}

async function getUserName(uid) {
  const snap = await getDoc(doc(db, "users", uid));
  return snap.exists() ? (snap.data().name || snap.data().email) : "User";
}
  // ===================== ONLINE / OFFLINE =====================
let onlineInterval = null;

async function updateOnlineStatus(isOnline) {
  if (!currentUser) return;

  await setDoc(doc(db, "users", currentUser.uid), {
    isOnline: isOnline,
    lastSeen: new Date()
  }, { merge: true });
}

function startOnlineHeartbeat() {
  updateOnlineStatus(true);

  if (onlineInterval) clearInterval(onlineInterval);

  onlineInterval = setInterval(() => {
    updateOnlineStatus(true);
  }, 30000);
}

window.addEventListener("beforeunload", () => {
  if (currentUser) {
    setDoc(doc(db, "users", currentUser.uid), {
      isOnline: false,
      lastSeen: new Date()
    }, { merge: true });
  }
});


  function getTimeMs(value) {
  if (!value) return null;
  if (value.toDate) return value.toDate().getTime();
  return new Date(value).getTime();
}

function isSessionExpired(chat) {
  if (!chat) return false;
  if (chat.status === "expired") return true;

  const endMs = getTimeMs(chat.sessionEndsAt);
  if (!endMs) return false;

  return Date.now() > endMs;
}

function updateSessionUI(chat) {
  currentChatData = chat;

  const expired = isSessionExpired(chat);
  const endMs = getTimeMs(chat.sessionEndsAt);

  if (sessionTimer) clearInterval(sessionTimer);

  if (!endMs) {
    chatMsg.innerText = "Session not started yet. Admin can start 15/30 min session.";
    chatMsg.style.color = "#f59e0b";
    messageInput.disabled = false;
    return;
  }

  function renderTimer() {
    const left = endMs - Date.now();

    if (left <= 0 || isSessionExpired(currentChatData)) {
      chatMsg.innerText = "Session expired. You cannot send new messages.";
      chatMsg.style.color = "red";
     messageInput.disabled = true;
      return;
    }

    const min = Math.floor(left / 60000);
    const sec = Math.floor((left % 60000) / 1000);

    chatMsg.innerText = `Paid session active: ${min}m ${sec}s left`;
    chatMsg.style.color = "green";
  messageInput.disabled = false;
  }

  renderTimer();
  sessionTimer = setInterval(renderTimer, 1000);
}


  // access block ui
function blockChatAccess(title, message) {
  chatTitle.innerText = title;
  chatBox.innerHTML = `
    <div style="text-align:center;padding:40px;">
      <h3>${escapeHTML(title)}</h3>
      <p>${escapeHTML(message)}</p>
      <a href="/connect-mentorship/mentor.html" class="btn">Browse Mentors</a>
    </div>
  `;

  messageInput.disabled = true;

  const inputArea = document.querySelector(".chat-input-area");
  if (inputArea) inputArea.style.display = "none";
}

  


// ✅ ADD HERE (immediately below)
async function verifyPaidSession(user) {
  if (!sessionId) {
    blockChatAccess(
      "Paid session required 🔒",
      "Please book a paid session from mentor profile before opening chat."
    );
    return false;
  }

  const sessionSnap = await getDoc(doc(db, "sessions", sessionId));

  if (!sessionSnap.exists()) {
    blockChatAccess(
      "Session not found ❌",
      "This booking session does not exist."
    );
    return false;
  }

  const session = sessionSnap.data();
 currentSessionData = session;

  const isMember =
    user.uid === session.studentId ||
    user.uid === session.mentorId;

  if (!isMember) {
    blockChatAccess(
      "Access denied ❌",
      "You are not allowed to open this private session."
    );
    return false;
  }

  if (session.chatId !== chatId) {
    blockChatAccess(
      "Invalid chat link ❌",
      "This chat does not match your booked session."
    );
    return false;
  }

  if (session.paymentStatus !== "paid" || !["paid", "active"].includes(session.status)) {
    blockChatAccess(
      "Payment pending 🔒",
      "Complete payment first. Chat will unlock after payment success."
    );
    return false;
  }

  
  updateCallButton();
  return true;
}




  // 🔥 CALL BUTTON LOGIC (PASTE HERE)
function updateCallButton() {
  if (
    currentSessionData &&
    currentSessionData.sessionType === "call" &&
    currentSessionData.paymentStatus === "paid"
  ) {
    startCallBtn.style.display = "block";
  } else {
    startCallBtn.style.display = "none";
  }
}

startCallBtn.onclick = function() {
  window.location.href = `/connect-mentorship/call.html?sessionId=${sessionId}`;
};
  

// ===================== CHAT INIT =====================
async function createOrLoadChat(user) {

  if (chatId) {
    const allowed = await verifyPaidSession(user);
    if (!allowed) return;

    const chatSnap = await getDoc(doc(db, "chats", chatId));

    if (!chatSnap.exists()) {
      chatBox.innerHTML = "Chat not found ❌";
      return;
    }

   const data = chatSnap.data();
currentChatData = data;
otherUserId = data.participants.find(id => id !== user.uid);

chatTitle.innerText = "Chat with " + await getUserName(otherUserId);

updateSessionUI(data);
listenChatStatus();
loadMessages();
    listenTyping();
    markChatAsRead();
   
    return;
  }

  if (!mentorId || user.uid === mentorId) {
    chatBox.innerHTML = "Invalid chat ❌";
    return;
  }

  chatId = [user.uid, mentorId].sort().join("_");
  otherUserId = mentorId;

  await setDoc(doc(db, "chats", chatId), {
  participants: [user.uid, mentorId],
  status: "pending",
  createdAt: serverTimestamp(),
  updatedAt: serverTimestamp(),
  sessionEndsAt: null,
  deleteAt: null
}, { merge: true });

 chatTitle.innerText = "Chat with " + await getUserName(mentorId);

listenChatStatus();
loadMessages();
  listenTyping();
  markChatAsRead();
 
}



  function listenChatStatus() {
  onSnapshot(doc(db, "chats", chatId), (snap) => {
    if (!snap.exists()) return;

    currentChatData = snap.data();
    updateSessionUI(currentChatData);
  });
}

// ===================== LOAD MESSAGES =====================
function loadMessages() {
  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(q, { includeMetadataChanges: true }, (snap) => {

  console.log("Realtime update triggered");  // ✅ ADD HERE

    chatBox.innerHTML = "";

    snap.docs.forEach(docSnap => {
      const msg = docSnap.data();

      const div = document.createElement("div");
      div.className = "message " + (msg.senderId === currentUser.uid ? "mine" : "other");
      div.innerHTML = escapeHTML(msg.text);

      chatBox.appendChild(div);
    });

    snap.docChanges().forEach(change => {
      if (change.type !== "added") return;

      const msg = change.doc.data();

      if (!firstMessageLoad && msg.senderId !== currentUser.uid) {
        showMessageNotification(msg.text);
      }
    });

    chatBox.scrollTop = chatBox.scrollHeight;

    firstMessageLoad = false;
    markChatAsRead();
  });
}

// ===================== SEND =====================
window.sendMessage = async function () {
  const text = messageInput.value.trim();

  // 🔴 BLOCK if session expired
  if (isSessionExpired(currentChatData)) {
    chatMsg.innerText = "Session expired. You cannot send new messages.";
    chatMsg.style.color = "red";
    return;
  }

  // 🟡 BLOCK if session not started
 if (!currentSessionData || currentSessionData.paymentStatus !== "paid") {
  chatMsg.innerText = "Payment required before sending messages.";
  chatMsg.style.color = "red";
  return;
}

  // 🔒 Existing validation
  if (!text || containsPrivateInfo(text)) return;
  await addDoc(collection(db, "chats", chatId, "messages"), {
    text,
    senderId: currentUser.uid,
    createdAt: serverTimestamp()
  });

  await setDoc(doc(db, "chats", chatId), {
    lastMessage: text,
    updatedAt: serverTimestamp(),
    unread: {
      [otherUserId]: increment(1),
      [currentUser.uid]: 0
    }
  }, { merge: true });

  messageInput.value = "";
  setTypingStatus(false);
};

// ===================== TYPING =====================
function listenTyping() {
  onSnapshot(collection(db, "chats", chatId, "typing"), snap => {
    let typing = false;

    snap.forEach(d => {
      if (d.id !== currentUser.uid && d.data().isTyping) {
        typing = true;
      }
    });

    document.getElementById("typingStatus").innerText = typing ? "Typing..." : "";
  });
}

async function setTypingStatus(val) {
  await setDoc(doc(db, "chats", chatId, "typing", currentUser.uid), {
    isTyping: val
  }, { merge: true });
}
  
enableNotifyBtn.addEventListener("click", async () => {
  await saveFcmToken();
});
messageInput.addEventListener("input", () => {
  setTypingStatus(true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => setTypingStatus(false), 1200);
});

// ===================== STATUS =====================
async function markChatAsRead() {
  await setDoc(doc(db, "chats", chatId), {
    unread: { [currentUser.uid]: 0 }
  }, { merge: true });
}

// ===================== NOTIFICATION =====================
async function saveFcmToken() {
  if (!("Notification" in window)) {
    console.log("Notifications not supported");
    return;
  }

  const permission = await Notification.requestPermission();
  console.log("Notification permission:", permission);

  if (permission !== "granted") {
    enableNotifyBtn.innerText = "🔕 Notifications Blocked";
    return;
  }

 const registration = await navigator.serviceWorker.register(
  "/connect-mentorship/firebase-messaging-sw.js"
);

const token = await getToken(messaging, {
  vapidKey: "BIYazYzPt-AW7rK5iIAmgFQxBVmczsUmiM5GmhHwXzv--xdx6TrjMCqixSK5g1XSAui_J3s1TgrhqqNlA37NAS4",
  serviceWorkerRegistration: registration
});

  if (!token || !currentUser) return;

  await setDoc(doc(db, "users", currentUser.uid), {
    fcmTokens: {
      [token]: true
    },
    updatedAt: new Date()
  }, { merge: true });

  enableNotifyBtn.innerText = "🔔 Notifications Enabled";
  console.log("FCM token saved:", token);
}


function showMessageNotification(text) {
  console.log("Trying notification:", Notification.permission, text);

  if (!("Notification" in window)) return;

  if (Notification.permission === "granted") {
    new Notification("New message on Connect", {
      body: text,
      icon: "/connect-mentorship/icon.png"
    });
  }
}

  onMessage(messaging, (payload) => {
  console.log("Foreground FCM:", payload);

  if ("Notification" in window && Notification.permission === "granted") {
    new Notification(payload.notification?.title || "New message on Connect", {
      body: payload.notification?.body || "You received a new message",
      icon: "/connect-mentorship/icon.png"
    });
  }
});

// ===================== INIT =====================
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "/connect-mentorship/login.html";

  currentUser = user;

  // ✅ ADD THIS LINE
  startOnlineHeartbeat();

  await createOrLoadChat(user);
});
</script>

<script type="module" src="auth.js"></script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
