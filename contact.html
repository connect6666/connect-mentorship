<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Connect Mentorship</title>

  <link rel="canonical" href="https://connect6666.github.io/connect-mentorship/contact.html">
  <link rel="stylesheet" href="style.css">

  <!-- Favicon fix -->
  <link rel="icon" href="/connect-mentorship/icon.png">
</head>

<body>

<!-- NAV -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask Question</a>
      <a href="mentor.html">Become Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="questions.html">Questions</a>

      <!-- ✅ Dynamic user area -->
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<!-- CONTACT SECTION -->
<section class="page-section">
  <div class="container">
    <h2>Send Us a Message</h2>

    <form class="question-form" id="contactForm">

      <input type="text" id="contactName" placeholder="Your Name" required>

      <input type="email" id="contactEmail" placeholder="Your Email" required>

      <textarea id="contactMessage" placeholder="Your Message" required></textarea>

      <!-- ✅ DPDP Consent -->
      <label style="font-size: 0.9rem; display:block; margin-bottom:10px;">
        <input type="checkbox" id="consent" required>
        I agree to the Privacy Policy and allow contact regarding my query.
      </label>

      <button type="submit" class="btn">Send Message</button>

      <p id="contactFormMessage"></p>
    </form>

    <!-- ✅ Trust Boost -->
    <p style="margin-top:15px; font-size:0.9rem;">
      📧 For urgent queries: connectmentorship2026@gmail.com
    </p>

  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<!-- 🔐 AUTH NAVBAR -->
<script type="module" src="auth.js"></script>

<!-- 🔥 FIREBASE CONTACT FORM -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhzR39wQx_z5Kyu-EYUHvilDkOElD9XJg",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship",
  storageBucket: "connect-mentorship.firebasestorage.app",
  messagingSenderId: "229549559214",
  appId: "1:229549559214:web:254671d221c2aaebc80c3f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("contactForm");
const message = document.getElementById("contactFormMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("contactName").value.trim();
  const email = document.getElementById("contactEmail").value.trim();
  const msg = document.getElementById("contactMessage").value.trim();
  const consent = document.getElementById("consent").checked;

  const btn = form.querySelector("button");

  // ✅ Email validation
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if (!name || !email || !msg || !emailValid || !consent) {
    message.innerText = "❌ Enter valid details & accept policy";
    message.style.color = "red";
    return;
  }

  // 🔥 Prevent multiple clicks
  btn.disabled = true;
  btn.innerText = "Sending...";

  try {
    await addDoc(collection(db, "contactMessages"), {
      name,
      email,
      message: msg,
      createdAt: serverTimestamp()
    });

    message.innerText = "✅ Message sent successfully!";
    message.style.color = "green";

    form.reset();

    // ✅ Auto clear message
    setTimeout(() => {
      message.innerText = "";
    }, 4000);

  } catch (error) {
    console.error(error);
    message.innerText = "❌ Error sending message";
    message.style.color = "red";
  }

  // Reset button
  btn.innerText = "Send Message";
  btn.disabled = false;
});
</script>

<!-- MENU TOGGLE -->
<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
