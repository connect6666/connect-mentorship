<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Connect Mentorship</title>

  <link rel="canonical" href="https://connect6666.github.io/connect-mentorship/contact.html">
  <link rel="stylesheet" href="style.css">

  <!-- Favicon fix -->
  <link rel="icon" href="/connect-mentorship/icon.png">
</head>

<body>

<!-- NAV -->
<nav>
  <div class="container">
    <div class="logo">Connect</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask Question</a>
      <a href="mentor.html">Become Mentor</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="questions.html">Questions</a>

      <!-- ✅ Dynamic user area -->
      <span id="userArea"></span>
    </div>
  </div>
</nav>

<!-- CONTACT SECTION -->
<section class="page-section">
  <div class="container">
    <h2>Send Us a Message</h2>

    <form class="question-form" id="contactForm">

      <input type="text" id="contactName" placeholder="Your Name" required>

      <input type="email" id="contactEmail" placeholder="Your Email" required>

      <textarea id="contactMessage" placeholder="Your Message" required></textarea>

      <!-- ✅ DPDP Consent -->
      <label style="font-size: 0.9rem; display:block; margin-bottom:10px;">
        <input type="checkbox" id="consent" required>
        I agree to the Privacy Policy and allow contact regarding my query.
      </label>

      <button type="submit" class="btn">Send Message</button>

      <p id="contactFormMessage"></p>
    </form>

    <!-- ✅ Trust Boost -->
    <p style="margin-top:15px; font-size:0.9rem;">
      📧 For urgent queries: connectmentorship2026@gmail.com
    </p>

  </div>
</section>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<!-- 🔐 AUTH NAVBAR -->
<script type="module">
import { db } from "./auth.js";
import { collection, addDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("contactForm");
const message = document.getElementById("contactFormMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("contactName").value.trim();
  const email = document.getElementById("contactEmail").value.trim();
  const msg = document.getElementById("contactMessage").value.trim();
  const consent = document.getElementById("consent")?.checked;

  const btn = form.querySelector("button");

  // 🔒 Disable button (prevent multiple clicks)
  btn.disabled = true;
  btn.innerText = "Sending...";

  // ❌ Validation
  if (!name || !email || !msg) {
    message.innerText = "❌ Fill all fields";
    message.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Send Message";
    return;
  }

  // ❌ Email validation
  if (!email.includes("@")) {
    message.innerText = "❌ Invalid email";
    message.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Send Message";
    return;
  }

  // ❌ Consent check
  if (!consent) {
    message.innerText = "❌ Please accept privacy policy";
    message.style.color = "red";
    btn.disabled = false;
    btn.innerText = "Send Message";
    return;
  }

  try {
    await addDoc(collection(db, "contactMessages"), {
      name,
      email,
      message: msg,
      createdAt: serverTimestamp()
    });

    // ✅ Success
    message.innerText = "✅ Message sent successfully!";
    message.style.color = "green";

    form.reset();

    // 🟢 Auto clear message
    setTimeout(() => {
      message.innerText = "";
    }, 4000);

  } catch (error) {
    console.error(error);
    message.innerText = "❌ Error sending message";
    message.style.color = "red";
  }

  // 🔓 Re-enable button
  btn.disabled = false;
  btn.innerText = "Send Message";
});
</script>

  <script type="module" src="auth.js"></script>
</body>
</html>
