<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Connect Mentorship</title>

<link rel="canonical" href="https://connect6666.github.io/connect-mentorship/contact.html">
<link rel="stylesheet" href="style.css">

<style>

/* =========================
   🎯 PAGE
========================= */

.contact-wrapper {
  max-width: 700px;
  margin: 50px auto;
  padding: 0 20px;
}

.contact-header {
  text-align: center;
  margin-bottom: 25px;
}

.contact-header p {
  color: #64748b;
}

/* CARD */
.contact-box {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* INPUTS */
.contact-box input,
.contact-box textarea {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}

/* EXTRA CONTACT */
.contact-alt {
  margin-top: 20px;
  font-size: 14px;
  color: #64748b;
  text-align: center;
}

.contact-alt a {
  color: #4f46e5;
  text-decoration: none;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>
  <div class="container nav-flex">
    <div class="logo"><a href="index.html">Connect</a></div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask.html">Ask</a>
      <a href="questions.html">Questions</a>
      <a href="mentor.html">Mentors</a>
    </div>
  </div>
</nav>

<div class="contact-wrapper">

  <div class="contact-header">
    <h2>Contact Us</h2>
    <p>Have questions, feedback, or suggestions? We’d love to hear from you.</p>
  </div>

  <div class="contact-box">

    <form id="contactForm">

      <input type="text" id="contactName" placeholder="Your Name" required>

      <input type="email" id="contactEmail" placeholder="Your Email" required>

      <textarea id="contactMessage" placeholder="Your Message" required></textarea>

      <button type="submit" class="btn">Send Message</button>

      <p id="contactFormMessage"></p>

    </form>

    <!-- EXTRA OPTIONS -->
    <div class="contact-alt">
      <p>Or reach us directly:</p>
      <p>📧 connectmentorship2026@gmail.com</p>
      <p>
        💬 <a href="https://wa.me/916284644053" target="_blank">
        Chat on WhatsApp
        </a>
      </p>
    </div>

  </div>

</div>

<footer>
  <p>© 2026 Connect Mentorship</p>
</footer>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "connect-mentorship.firebaseapp.com",
  projectId: "connect-mentorship"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("contactForm");
const message = document.getElementById("contactFormMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = contactName.value.trim();
  const email = contactEmail.value.trim();
  const msg = contactMessage.value.trim();

  if (!name || !email || !msg) {
    message.innerText = "❌ Fill all fields";
    message.style.color = "red";
    return;
  }

  try {
    await addDoc(collection(db, "contactMessages"), {
      name,
      email,
      message: msg,
      createdAt: new Date()
    });

    message.innerText = "✅ Message sent successfully!";
    message.style.color = "green";
    form.reset();

  } catch (error) {
    message.innerText = "❌ Error sending message";
    message.style.color = "red";
  }
});

</script>

<script>
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
